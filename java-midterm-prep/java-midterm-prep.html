<style>
:root {
  --bg: #f5f6fa; --surface: #ffffff; --surface-2: #eef0f6; --border: #dde1ea;
  --text: #1b1f2a; --muted: #5d6475; --accent: #2f5fe0; --accent-2: #e8eeff; --accent-text: #ffffff;
  --good: #16803c; --good-bg: #e3f6ea; --bad: #c62a2a; --bad-bg: #fde8e8; --warn: #a35d00; --warn-bg: #fff2dc;
  --code-bg: #f7f8fb; --code-text: #24292f;
  --tk-k: #a626a4; --tk-t: #0f6fb1; --tk-s: #2c7a20; --tk-n: #b35a00; --tk-c: #8a8f98; --tk-cl: #b0451c; --tk-f: #3a4fd6; --tk-l: #0f6fb1;
  --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.06);
  --radius: 12px;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b24; --surface-2: #1f2430; --border: #2b3240;
  --text: #e6e9ef; --muted: #9aa3b5; --accent: #6d93ff; --accent-2: #1e2a4a; --accent-text: #0b1020;
  --good: #4fd17f; --good-bg: #12301f; --bad: #ff7a7a; --bad-bg: #3a1618; --warn: #ffb44d; --warn-bg: #3a2a10;
  --code-bg: #12151d; --code-text: #d7dce5;
  --tk-k: #d58cf0; --tk-t: #6cb6ff; --tk-s: #98d98e; --tk-n: #f2a65a; --tk-c: #6b7385; --tk-cl: #f09070; --tk-f: #8ea2ff; --tk-l: #6cb6ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
/* no programming ligatures: <= must look like <= (the font shorthand would reset these, hence !important) */
* { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0 !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
kbd { font-family: var(--mono); font-size: .8em; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 .4em; background: var(--surface); color: var(--muted); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--text); white-space: nowrap; }
.logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-family: var(--mono); font-size: 13px; font-weight: 800; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 11px; border-radius: 8px; white-space: nowrap; font-size: 14.5px; font-weight: 500; }
nav.tabs a:hover { background: var(--surface-2); color: var(--text); }
nav.tabs a.active { background: var(--accent-2); color: var(--accent); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }

main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 80px; }
h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 1.25rem; margin: 26px 0 12px; }
h3 { font-size: 1.05rem; margin: 0 0 6px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .kb { font-family: var(--mono); font-size: 11px; opacity: .75; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }

.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: stretch; }
.hero .card.main { background: linear-gradient(135deg, var(--accent) 0%, #6a4ee0 100%); color: #fff; border: none; }
.hero .card.main .muted { color: rgba(255,255,255,.85); }
.hero .card.main .btn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); color: #fff; }
.hero .card.main .btn.primary { background: #fff; color: #2338a8; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.35rem; }
.stat span { font-size: .8rem; color: var(--muted); }

.mode-card { cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform .12s, border-color .12s; }
.mode-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.mode-card .mi { font-size: 22px; width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-2); color: var(--accent); margin-bottom: 10px; font-family: var(--mono); font-weight: 800; font-size: 15px; }

.topic-card { display: flex; flex-direction: column; gap: 8px; }
.topic-card .ti { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-2); border-radius: 7px; padding: 2px 7px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--good); }
.bar.mid > i { background: var(--warn); }
.bar.low > i { background: var(--bad); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.weak { background: var(--bad-bg); color: var(--bad); }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.new { background: var(--accent-2); color: var(--accent); }
.badge.d1 { background: var(--good-bg); color: var(--good); }
.badge.d2 { background: var(--warn-bg); color: var(--warn); }
.badge.d3 { background: var(--bad-bg); color: var(--bad); }
.topic-card.is-weak { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset, var(--shadow); }

/* filters */
.filters { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.chip.weak:not(.on) { border-color: var(--bad); color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 6px 13px; cursor: pointer; font-size: 14px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }

/* question */
.qwrap { max-width: 820px; margin: 0 auto; }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.progress-line { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress-line i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qtext { font-size: 1.1rem; font-weight: 600; margin: 4px 0 12px; white-space: pre-wrap; }
pre.code { background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font: 14px/1.55 var(--mono); margin: 10px 0; tab-size: 4; }
pre.code.numbered { padding-left: 0; }
pre.code .ln { display: inline-block; width: 2.6em; text-align: right; padding-right: 12px; color: var(--tk-c); user-select: none; }
.stdin { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 8px; margin: 10px 0; font-size: .92rem; }
.stdin pre { margin: 4px 0 0; font: 13.5px/1.5 var(--mono); white-space: pre-wrap; }
.tk-k { color: var(--tk-k); font-weight: 600; } .tk-t { color: var(--tk-t); font-weight: 600; } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); }
.tk-c { color: var(--tk-c); font-style: italic; } .tk-cl { color: var(--tk-cl); } .tk-f { color: var(--tk-f); } .tk-l { color: var(--tk-l); font-weight: 600; }

.opts { display: grid; gap: 9px; margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1.5px solid var(--border); background: var(--surface); border-radius: 11px; padding: 11px 14px; cursor: pointer; width: 100%; transition: border-color .1s, background .1s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-2); }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 700 12.5px var(--mono); background: var(--surface-2); color: var(--muted); }
.opt .ob { flex: 1; min-width: 0; padding-top: 1px; overflow-wrap: anywhere; }
.opt .ob pre { margin: 0; font: 14px/1.5 var(--mono); white-space: pre-wrap; }
.opt.selected { border-color: var(--accent); background: var(--accent-2); }
.opt.selected .key { background: var(--accent); color: var(--accent-text); }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.dim { opacity: .6; }
.opt:disabled { cursor: default; color: inherit; }

.feedback { margin-top: 14px; border-radius: 11px; padding: 12px 14px; border: 1px solid; }
.feedback.good { background: var(--good-bg); border-color: var(--good); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback .fh { font-weight: 800; margin-bottom: 4px; }
.feedback.good .fh { color: var(--good); } .feedback.bad .fh { color: var(--bad); }

.nav-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

textarea.answer { width: 100%; min-height: 110px; font: 14.5px/1.5 var(--mono); padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--code-bg); resize: vertical; }
textarea.answer:focus, input:focus, .editor:focus-within { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.diff pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 13.5px/1.55 var(--mono); white-space: pre-wrap; overflow-x: auto; min-height: 2.4em; }
.diff .bad-line { background: var(--bad-bg); color: var(--bad); display: block; }
.diff .good-line { display: block; }

/* bug mode */
.bug-code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 6px 0; margin: 10px 0; overflow-x: auto; font: 14px/1.55 var(--mono); }
.bug-line { display: flex; cursor: pointer; padding: 1px 12px 1px 0; border-left: 3px solid transparent; white-space: pre; min-width: max-content; }
.bug-line:hover { background: var(--accent-2); }
.bug-line .ln { width: 2.8em; flex: none; text-align: right; padding-right: 12px; color: var(--tk-c); user-select: none; }
.bug-line.sel { background: var(--accent-2); border-left-color: var(--accent); }
.bug-line.cursor { outline: 1px dashed var(--accent); outline-offset: -1px; }
.bug-line.ans { background: var(--good-bg); border-left-color: var(--good); }
.bug-line.wrongsel { background: var(--bad-bg); border-left-color: var(--bad); }
.bug-line.blank { cursor: default; }

/* editor */
.editor { display: flex; border: 1.5px solid var(--border); border-radius: 10px; background: var(--code-bg); overflow: hidden; height: 380px; resize: vertical; min-height: 200px; }
.editor .gutter { flex: none; padding: 12px 8px 12px 0; text-align: right; color: var(--tk-c); font: 14px/1.55 var(--mono); user-select: none; overflow: hidden; min-width: 3em; border-right: 1px solid var(--border); background: var(--surface-2); }
.editor .ed { position: relative; flex: 1; min-width: 0; }
.editor pre, .editor textarea { position: absolute; inset: 0; margin: 0; padding: 12px; font: 14px/1.55 var(--mono); tab-size: 4; white-space: pre; overflow: auto; border: 0; letter-spacing: 0; word-spacing: 0; }
.editor pre { pointer-events: none; color: var(--code-text); overflow: hidden; }
.editor textarea { background: transparent; color: transparent; caret-color: var(--text); resize: none; outline: none; -webkit-text-fill-color: transparent; }
.editor textarea::selection { background: rgba(80,120,255,.3); }

/* exam */
.exam-bar { position: sticky; top: 57px; z-index: 10; background: var(--bg); padding: 8px 0 10px; }
.timer { font: 700 1.15rem var(--mono); padding: 6px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.palette button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px; }
.palette button.done { background: var(--accent-2); border-color: var(--accent); color: var(--accent); }
.palette button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.palette button.r-good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.palette button.r-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.big-score { font-size: 3rem; font-weight: 800; line-height: 1; }
table.t { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.t th, table.t td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.cheat table.t td:first-child, .cheat table.t td code { font-family: var(--mono); font-size: .88rem; }
.cheat-sec { margin-top: 18px; }
.cheat-sec ul { padding-left: 20px; margin: 6px 0; }
.cheat-sec li { margin: 3px 0; }
.recent { display: inline-flex; gap: 3px; }
.recent i { width: 8px; height: 14px; border-radius: 2px; background: var(--good); display: inline-block; }
.recent i.x { background: var(--bad); }
.review-item { margin-top: 14px; }

.modal-bg { position: fixed; inset: 0; background: rgba(5,8,15,.55); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { max-width: 560px; width: 100%; max-height: 85vh; overflow: auto; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; font-size: .94rem; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; z-index: 200; font-size: 14px; box-shadow: var(--shadow); }
.empty { text-align: center; padding: 40px 16px; }
.task-list .card { cursor: pointer; }
.task-list .card:hover { border-color: var(--accent); }
.split { display: grid; grid-template-columns: 1fr; gap: 14px; }
.output-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font: 13.5px/1.5 var(--mono); white-space: pre-wrap; margin: 6px 0; }
input[type=date], select { border: 1px solid var(--border); background: var(--surface); padding: 6px 9px; border-radius: 8px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .diff { grid-template-columns: 1fr; }
  h1 { font-size: 1.4rem; }
  .brand span.full { display: none; }
  main { padding-top: 16px; }
  .card { padding: 14px; }
  .exam-bar { top: 55px; }
  .cheat table.t th, .cheat table.t td { padding: 7px 5px; font-size: .8rem; overflow-wrap: anywhere; }
  .cheat table.t td:first-child { font-size: .76rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

// J`...` keeps Java code exactly as written (backslashes included) and trims the surrounding blank lines.
function J(s, ...v) {
  const raw = String.raw(s, ...v).replace(/^\n/, '').replace(/\s+$/, '');
  const lines = raw.split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind)).join('\n');
}

  { id: 'ops', name: 'Operators', icon: '+%' },
  { id: 'cast', name: 'Casting & conversion', icon: '(int)' },
  { id: 'scanner', name: 'Input with Scanner', icon: 'in' },
  { id: 'cond', name: 'Conditionals', icon: 'if' },
  { id: 'loops', name: 'Loops', icon: 'for' },

/* Quiz questions.
   o[0] is ALWAYS the correct option (options are shuffled at runtime).
   tf:1 = true/false question with answer a.
   c = Java code (fragments are placed inside main), in = keyboard input.
   v = how the build check verified the code: 'out' (prints o[0]), 'ce' (compile error),
       'rt' (runtime exception), 'ok' (compiles and runs); vx = exact expected output. */
const QUIZ = [
// ---------- 1. Program structure ----------
{t:'struct',d:1,q:'Which is the correct header of the `main` method that Java looks for when it starts a program?',oc:1,o:['public static void main(String[] args)','public void main(String[] args)','static public int main(String args)','public static main(String[] args)'],e:'The JVM looks for a method that is `public` (callable from outside), `static` (no object needed), returns `void`, is named `main` and takes a `String[]`.'},
{t:'struct',d:1,tf:1,a:true,q:'Java is case-sensitive: `System.out.println` and `system.out.println` are NOT the same thing.',e:'`System` is a class name with a capital S. Writing `system` causes a compile error (package system does not exist).'},
{t:'struct',d:1,q:'Which character ends most Java statements?',o:['`;` (semicolon)','`.` (period)','`:` (colon)','`}` (closing brace)'],e:'Every simple statement ends with a semicolon. Braces close blocks; they do not end statements.'},
{t:'struct',d:1,q:'How do you write a single-line comment in Java?',o:['`// comment`','`# comment`','`<!-- comment -->`','`-- comment`'],e:'`//` comments out the rest of the line. `#` is Python, `<!-- -->` is HTML and `--` is SQL.'},
{t:'struct',d:1,q:'How do you write a comment that spans several lines?',o:['`/* ... */`','`// ... //`','`{* ... *}`','`<* ... *>`'],e:'`/*` starts a block comment and `*/` ends it. (`/** ... */` is a Javadoc comment, which is also valid.)'},
{t:'struct',d:1,q:'A file contains `public class Hello { ... }`. What must the file be called?',o:['`Hello.java`','`hello.java`','`Hello.class`','`Main.java`'],e:'A public class must be saved in a file with exactly the same name (case-sensitive) plus `.java`. Compiling it produces `Hello.class`.'},
{t:'struct',d:1,q:'Which command compiles the source file `Hello.java`?',o:['`javac Hello.java`','`java Hello`','`run Hello.java`','`compile Hello`'],e:'`javac` is the compiler; it creates `Hello.class`. Then `java Hello` runs the compiled class.'},
{t:'struct',d:1,q:'What does the Java compiler (`javac`) produce?',o:['Bytecode in a `.class` file','A Windows `.exe` file','Another `.java` file','Machine code for one specific CPU only'],e:'Java compiles to platform-independent bytecode, which the Java Virtual Machine (JVM) runs. That is why Java is "write once, run anywhere".'},
{t:'struct',d:1,q:'What is the difference between `print` and `println`?',o:['`println` moves to a new line after printing; `print` does not','`print` moves to a new line after printing; `println` does not','`println` can only print Strings','There is no difference'],e:'`System.out.println(x)` prints x followed by a line break. `System.out.print(x)` leaves the cursor on the same line.'},
{t:'struct',d:2,q:'What is printed?',c:J`
System.out.print("A");
System.out.println("B");
System.out.print("C");
`,o:['AB\nC','A\nB\nC','ABC','A\nBC'],v:'out',e:'`print("A")` stays on the line, `println("B")` prints B and then a line break, so C ends up on the second line.'},
{t:'struct',d:1,tf:1,a:true,q:'`System.out.println();` with no argument is valid and just prints an empty line.',c:J`
System.out.println("Hi");
System.out.println();
System.out.println("Bye");
`,vx:'Hi\n\nBye',e:'With no argument, `println()` prints only a line break, which produces a blank line.'},
{t:'struct',d:2,q:'Which statement correctly prints:  He said "hi"',oc:1,o:[J`System.out.println("He said \"hi\"");`,J`System.out.println("He said "hi"");`,J`System.out.println('He said "hi"');`,J`System.out.println("He said \hi\");`],e:'Inside a String, a double quote must be escaped as `\\"`. Single quotes are only for a single `char`, never for Strings.'},
{t:'struct',d:2,q:'What is printed?',c:J`
System.out.println("Line1\nLine2");
`,o:['Line1\nLine2','Line1\\nLine2','Line1Line2','Line1 Line2'],v:'out',e:'`\\n` inside a String is the newline escape sequence, so the text is split over two lines.'},
{t:'struct',d:2,q:'Which statement does NOT compile?',oc:1,o:['System.out.println("Hi")','System.out.println("Hi");','System.out.print("Hi" + 5);','System.out.println(5 + 5);'],e:'The first one is missing its semicolon: error: \';\' expected.'},
{t:'struct',d:1,q:'What do curly braces `{ }` do in Java?',o:['Mark the beginning and end of a block, such as a class or method body','End a statement','Start a comment','Hold the arguments of a method call'],e:'Braces group statements into a block: the class body, a method body, the body of an if or a loop. Parentheses `( )` hold method arguments.'},
{t:'struct',d:1,tf:1,a:true,q:'Comments are ignored by the compiler, so they do not change what the program does.',e:'Comments exist only for human readers.'},
{t:'struct',d:3,tf:1,a:true,q:'One `.java` file may contain several classes, but at most one top-level class in it can be `public`.',e:'And if there is a public class, the file must be named after it.'},
{t:'struct',d:2,q:'In `public static void main(String[] args)`, what is `args`?',o:['An array of Strings holding the command-line arguments','The return value of the program','A Scanner that reads keyboard input','A keyword that cannot be renamed'],e:'`args` is just a parameter name (you may rename it). It receives the words typed after `java ClassName` on the command line.'},
{t:'struct',d:3,q:'What is printed?',c:J`
// System.out.println("A");
System.out.println("B"); /* System.out.println("C"); */
/*
System.out.println("D");
*/
`,o:['B','A\nB\nC\nD','B\nC','B\nD'],v:'out',e:'Line 1 is a single-line comment, the C statement is inside `/* */`, and so is D. Only B runs.'},
{t:'struct',d:2,q:'Which statement about how a Java program runs is correct?',o:['Source code (.java) is compiled to bytecode (.class), which the JVM runs','The JVM runs .java files directly, so compiling is never needed','`javac` runs the program and `java` compiles it','Bytecode only runs on the operating system where it was compiled'],e:'Write → compile with `javac` → run the bytecode with the JVM (`java`). The same .class file runs on any OS that has a JVM.'},

// ---------- 2. Data types ----------
{t:'types',d:1,q:'How many bits does an `int` use in Java?',o:['32 bits (4 bytes)','16 bits (2 bytes)','64 bits (8 bytes)','8 bits (1 byte)'],e:'byte = 8, short = 16, int = 32, long = 64 bits. In Java these sizes are the same on every platform.'},
{t:'types',d:1,q:"Which primitive type stores a single character such as `'A'`?",o:['`char`','`String`','`byte`','`boolean`'],e:'`char` holds one 16-bit Unicode character. `String` is not a primitive; it is a class for sequences of characters.'},
{t:'types',d:1,q:'Which is a valid `char` literal?',oc:1,o:["'A'",'"A"',"'AB'",'A'],e:"A char literal is exactly one character in single quotes. `\"A\"` is a String, `'AB'` has two characters, and `A` alone would be read as a variable name."},
{t:'types',d:1,q:'Which values can a `boolean` variable hold?',o:['`true` and `false`','`0` and `1`','`"true"` and `"false"`','`TRUE` and `FALSE`'],e:'Java booleans are only `true` or `false` (lowercase). Unlike C, numbers are not booleans.'},
{t:'types',d:2,q:'What is the largest value an `int` can hold?',o:['2147483647 (about 2.1 billion)','32767','9223372036854775807','4294967295'],e:'int range: −2,147,483,648 to 2,147,483,647 (−2³¹ to 2³¹−1). 32767 is the max of short; 9223372036854775807 is the max of long.'},
{t:'types',d:2,q:'How many bits does a `long` use?',o:['64','32','128','16'],e:'long is 64 bits, range about ±9.22 × 10¹⁸. Use it when int is too small.'},
{t:'types',d:2,q:'How do `float` and `double` compare?',o:['float is 32 bits (~7 digits), double is 64 bits (~15–16 digits)','float is 64 bits, double is 32 bits','Both are 32 bits; double is just a newer name','float stores whole numbers only'],e:'double has about twice the precision of float and is the default type for decimal literals like 3.14.'},
{t:'types',d:2,q:'Which declaration does NOT compile?',oc:1,o:['float f = 3.14;','double d = 3.14;','float f = 3.14f;','long n = 100;'],e:'`3.14` is a double literal. Storing a double in a float could lose precision, so Java requires the `f` suffix (or a cast).'},
{t:'types',d:2,q:'Which line correctly stores three billion?',oc:1,o:['long big = 3000000000L;','int big = 3000000000;','long big = 3000000000;','long big = "3000000000";'],e:'3000000000 is bigger than the int maximum, so without the `L` suffix the literal itself is a compile error ("integer number too large"), even when you assign it to a long.'},
{t:'types',d:1,tf:1,a:false,q:'`String` is one of Java\'s primitive types.',e:'The 8 primitives are byte, short, int, long, float, double, char and boolean. String is a class (a reference type), which is why it starts with a capital letter.'},
{t:'types',d:3,q:'What is printed?',c:J`
int x = Integer.MAX_VALUE;
x = x + 1;
System.out.println(x);
`,o:['-2147483648','2147483648','Compilation error','An ArithmeticException is thrown'],v:'out',e:'Integer overflow wraps around silently: one more than the maximum int becomes the minimum int. No error is reported.'},
{t:'types',d:2,q:'What is printed?',c:J`
char c = 'A';
c++;
System.out.println(c);
`,o:['B','A','66','Compilation error'],v:'out',e:"`++` on a char moves to the next character: 'A' (65) becomes 'B' (66), and it is still printed as a char."},
{t:'types',d:3,q:'What is printed?',c:J`
char c = 'A';
System.out.println(c + 1);
`,o:['66','B','A1','Compilation error'],v:'out',e:'In `c + 1` the char is promoted to int (65), so the result 66 is an int and a number is printed. Compare with `c++`, which keeps the char type.'},
{t:'types',d:1,q:'What is the type of the literal `42`? And of `3.5`?',o:['`int` and `double`','`long` and `float`','`int` and `float`','`short` and `double`'],e:'Whole-number literals are int by default (add L for long). Decimal literals are double by default (add f for float).'},
{t:'types',d:1,q:'Which type is the most natural choice for a price such as 19.99?',o:['`double`','`int`','`char`','`boolean`'],e:'double stores decimal numbers. (Real banking software uses BigDecimal to avoid rounding errors, but double is fine for this course.)'},
{t:'types',d:2,tf:1,a:false,q:'The line `boolean b = 1;` compiles in Java.',c:J`
boolean b = 1;
`,v:'ce',e:'Error: incompatible types: int cannot be converted to boolean. In Java, numbers and booleans never mix.'},
{t:'types',d:3,q:'How large is a `char` in Java, and what is its range?',o:['16 bits, 0 to 65535 (unsigned)','8 bits, −128 to 127','8 bits, 0 to 255','32 bits, like int'],e:'Java chars are 16-bit Unicode code units. They are unsigned and can hold 0–65535.'},
{t:'types',d:3,q:'What is printed?',c:J`
double d = 0.1 + 0.2;
System.out.println(d);
`,o:['0.30000000000000004','0.3','0.30','Compilation error'],v:'out',e:'0.1 and 0.2 cannot be stored exactly in binary, so a tiny rounding error appears. Never compare doubles with == expecting exact results.'},
{t:'types',d:1,q:'Which of these is NOT a primitive type?',o:['`String`','`int`','`char`','`boolean`'],e:'String is a class. Primitive type names are all lowercase: byte, short, int, long, float, double, char, boolean.'},
{t:'types',d:2,q:'What is the range of a `byte`?',o:['−128 to 127','0 to 255','−256 to 255','−32768 to 32767'],e:'byte is 8 bits and signed: −2⁷ to 2⁷−1.'},

// ---------- 3. Variables, constants, naming ----------
{t:'vars',d:1,q:'Which is a valid variable name?',oc:1,o:['totalScore','2ndPlace','total-score','class'],e:'Names may contain letters, digits, `_` and `$`, but cannot start with a digit, cannot contain `-` or spaces, and cannot be a keyword like `class`.'},
{t:'vars',d:1,q:'Which variable name is INVALID?',oc:1,o:['my var','_count','$price','value2'],e:'Spaces are not allowed in names. Underscore and dollar sign are legal (though `$` is rarely used).'},
{t:'vars',d:1,q:'Which keyword makes a variable a constant (its value cannot change after it is set)?',o:['`final`','`const`','`static`','`constant`'],e:'`final int MAX = 10;` creates a constant. `const` is a reserved word in Java, but it is not used for anything.'},
{t:'vars',d:2,q:'What happens with this code?',c:J`
final int MAX = 10;
MAX = 20;
System.out.println(MAX);
`,o:['Compilation error: cannot assign a value to final variable MAX','It prints 20','It prints 10','It compiles but throws an exception when run'],v:'ce',e:'A final variable can be assigned only once. The compiler rejects the second assignment.'},
{t:'vars',d:1,tf:1,a:true,q:'`count` and `Count` are two different variable names in Java.',e:'Java names are case-sensitive.'},
{t:'vars',d:1,q:'By convention, how should a constant be named?',oc:1,o:['MAX_SIZE','maxSize','MaxSize','max-size'],e:'Constants use UPPER_SNAKE_CASE. Variables and methods use camelCase; classes use PascalCase. `max-size` is not even legal.'},
{t:'vars',d:1,q:'By convention, how should a normal variable be named?',oc:1,o:['studentCount','StudentCount','STUDENT_COUNT','student_Count_'],e:'Variables use lowerCamelCase: the first word lowercase, each following word capitalized.'},
{t:'vars',d:2,q:'What happens with this code inside `main`?',c:J`
int x;
System.out.println(x);
`,o:['Compilation error: variable x might not have been initialized','It prints 0','It prints null','It prints a random value'],v:'ce',e:'Local variables have no default value. Java refuses to compile code that reads a local variable before it has been assigned.'},
{t:'vars',d:2,tf:1,a:true,q:'The statement `int a = 1, b = 2, c;` is legal: it declares three int variables and initializes two of them.',c:J`
int a = 1, b = 2, c;
c = a + b;
System.out.println(c);
`,vx:'3',e:'Several variables of the same type can be declared in one statement, separated by commas.'},
{t:'vars',d:2,q:'What is printed?',c:J`
int a = 5;
int b = a;
a = 10;
System.out.println(b);
`,o:['5','10','15','0'],v:'out',e:'`b = a` copies the value 5 into b. Changing a afterwards does not affect b.'},
{t:'vars',d:2,q:'Which of these words is a reserved keyword and therefore cannot be used as a variable name?',oc:1,o:['int','main','String','value'],e:'`int` is a keyword. `main` and `String` are not keywords (they are a method name and a class name), so technically they are allowed as names, although that is bad style.'},
{t:'vars',d:3,q:'This code tries to swap a and b. What is printed?',c:J`
int a = 3, b = 7;
a = b;
b = a;
System.out.println(a + " " + b);
`,o:['7 7','7 3','3 7','3 3'],v:'out',e:'After `a = b`, the old value 3 is lost. Then `b = a` copies 7 back. A correct swap needs a temporary variable: `int t = a; a = b; b = t;`.'},
{t:'vars',d:2,q:'What happens with this code?',c:J`
for (int i = 0; i < 3; i++) {
    System.out.print(i);
}
System.out.println(i);
`,o:['Compilation error: cannot find symbol i','It prints 0123','It prints 0122','It prints 012 and then 0'],v:'ce',e:'A variable declared in the for header only exists inside the loop (its scope). After the loop, `i` is unknown.'},
{t:'vars',d:2,tf:1,a:true,q:'A local `final` variable may be declared first and assigned later, as long as it is assigned exactly once.',c:J`
final int X;
X = 5;
System.out.println(X);
`,vx:'5',e:'Assigning it a second time would be a compile error.'},
{t:'vars',d:3,q:'What happens with this code?',c:J`
int x = 10;
{
    int x = 20;
    System.out.println(x);
}
`,o:['Compilation error: variable x is already defined','It prints 20','It prints 10','It prints 30'],v:'ce',e:'Java does not allow a local variable to be declared again in an inner block while the outer one is still in scope.'},
{t:'vars',d:1,q:'Which statement declares a variable AND initializes it?',oc:1,o:['int age = 18;','int age;','age = 18;','int = 18 age;'],e:'`int age;` only declares, `age = 18;` only assigns, and the last one is not valid syntax.'},
{t:'vars',d:2,q:'Which name is legal in Java?',oc:1,o:['_$value1','1value','value#1','my-value'],e:'Names may use letters, digits, `_` and `$`, and must not start with a digit. `#` and `-` are not allowed.'},
{t:'vars',d:3,q:'What is printed?',c:J`
final double PI = 3.14159;
int r = 2;
System.out.println(PI * r * r);
`,o:['12.56636','12','12.0','Compilation error: a final variable cannot be used in a calculation'],v:'out',e:'final only means PI cannot be reassigned; it can be used in calculations freely. double × int gives a double.'},

// ---------- 4. Operators ----------
{t:'ops',d:1,q:'What is printed?',c:J`
System.out.println(7 / 2);
`,o:['3','3.5','4','3.0'],v:'out',e:'Both operands are int, so this is integer division: the decimal part is cut off (not rounded).'},
{t:'ops',d:1,q:'What is printed?',c:J`
System.out.println(7 % 3);
`,o:['1','2','2.33','0'],v:'out',e:'% gives the remainder: 7 = 2 × 3 + 1.'},
{t:'ops',d:1,q:'What is printed?',c:J`
System.out.println(7.0 / 2);
`,o:['3.5','3','3.0','4'],v:'out',e:'If at least one operand is a double, the division is done with decimals.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int i = 5;
int j = i++;
System.out.println(i + " " + j);
`,o:['6 5','6 6','5 6','5 5'],v:'out',e:'Post-increment `i++` gives the OLD value (5) and then increases i to 6.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int i = 5;
int j = ++i;
System.out.println(i + " " + j);
`,o:['6 6','6 5','5 6','5 5'],v:'out',e:'Pre-increment `++i` increases i first and then gives the NEW value.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int x = 10;
x += 5;
x *= 2;
System.out.println(x);
`,o:['30','25','20','15'],v:'out',e:'`x += 5` makes x 15, then `x *= 2` makes it 30.'},
{t:'ops',d:1,q:'What is printed?',c:J`
System.out.println(2 + 3 * 4);
`,o:['14','20','24','9'],v:'out',e:'Multiplication has higher precedence than addition: 2 + 12.'},
{t:'ops',d:2,q:'What is printed?',c:J`
System.out.println((2 + 3) * 4 % 7);
`,o:['6','20','2','5'],v:'out',e:'Parentheses first: 5. Then * and % have the same precedence and go left to right: 5 * 4 = 20, 20 % 7 = 6.'},
{t:'ops',d:3,q:'What is printed?',c:J`
System.out.println(-7 % 3);
`,o:['-1','2','1','-2'],v:'out',e:'In Java the result of % takes the sign of the LEFT operand: −7 = (−2) × 3 + (−1).'},
{t:'ops',d:1,q:'What is the difference between `=` and `==`?',o:['`=` assigns a value; `==` compares two values','`=` compares; `==` assigns','They are interchangeable','`==` is only used for Strings'],e:'`x = 5` stores 5 in x. `x == 5` is a boolean expression that is true when x equals 5.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int a = 5, b = 10;
System.out.println(a > 3 && b < 5);
`,o:['false','true','5','Compilation error'],v:'out',e:'`a > 3` is true but `b < 5` is false; && needs both sides to be true.'},
{t:'ops',d:3,q:'What is printed?',c:J`
System.out.println(true || false && false);
`,o:['true','false','Compilation error','null'],v:'out',e:'&& has higher precedence than ||, so this is `true || (false && false)` = `true || false` = true.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int x = 0;
boolean r = (x != 0) && (10 / x > 1);
System.out.println(r);
`,o:['false','true','ArithmeticException: / by zero','Compilation error'],v:'out',e:'&& short-circuits: the left side is false, so the right side (which would divide by zero) is never evaluated.'},
{t:'ops',d:1,tf:1,a:false,q:'The expression `!(5 > 3)` evaluates to true.',c:J`
System.out.println(!(5 > 3));
`,vx:'false',e:'5 > 3 is true, and `!` negates it, giving false.'},
{t:'ops',d:3,q:'What is printed?',c:J`
int x = 5;
x = x++ + ++x;
System.out.println(x);
`,o:['12','11','13','10'],v:'out',e:'Left to right: `x++` gives 5 (x becomes 6), then `++x` makes x 7 and gives 7. 5 + 7 = 12 is stored in x.'},
{t:'ops',d:2,q:'What is printed?',c:J`
int x = 17;
System.out.println(x / 5 + x % 5);
`,o:['5','3','2','5.4'],v:'out',e:'17 / 5 = 3 (integer division) and 17 % 5 = 2, so 3 + 2 = 5.'},
{t:'ops',d:3,q:'What is printed?',c:J`
double avg = (3 + 4) / 2;
System.out.println(avg);
`,o:['3.0','3.5','3','4.0'],v:'out',e:'The division happens between two ints first (7 / 2 = 3); only then is 3 converted to 3.0 for the double variable.'},
{t:'ops',d:2,tf:1,a:true,q:'The `%` operator also works with double values: this prints 1.5.',c:J`
System.out.println(5.5 % 2);
`,vx:'1.5',e:'5.5 = 2 × 2 + 1.5. Java allows % on floating-point numbers too.'},
{t:'ops',d:3,q:'What is printed?',c:J`
int x = 10;
x -= 3 - 1;
System.out.println(x);
`,o:['8','6','9','12'],v:'out',e:'The right side is evaluated first: 3 − 1 = 2, then x = 10 − 2 = 8.'},
{t:'ops',d:1,q:'Which operator gives the remainder of a division?',o:['`%`','`/`','`//`','`mod`'],e:'`%` is the remainder (modulo) operator. `//` starts a comment in Java!'},
{t:'ops',d:2,q:'Which expression checks whether the int `n` is even?',oc:1,o:['n % 2 == 0','n / 2 == 0','n % 2 == 1','n % 2 = 0'],e:'A number is even when the remainder after dividing by 2 is 0. (`= 0` would be an assignment, a compile error here.)'},

// ---------- 5. Type casting & conversion ----------
{t:'cast',d:1,q:'Which conversion happens automatically (implicit widening), without a cast?',o:['int → double','double → int','long → int','double → float'],e:'Widening (smaller type → bigger type) is automatic because no information is lost. Narrowing (e.g. double → int) requires an explicit cast.'},
{t:'cast',d:1,q:'What is printed?',c:J`
double d = 9.99;
int n = (int) d;
System.out.println(n);
`,o:['9','10','9.99','Compilation error'],v:'out',e:'Casting a double to int truncates: the decimal part is simply dropped, no rounding.'},
{t:'cast',d:2,q:'What is printed?',c:J`
System.out.println((int) -3.7);
`,o:['-3','-4','-3.7','3'],v:'out',e:'Truncation goes toward zero, so −3.7 becomes −3 (not −4).'},
{t:'cast',d:2,q:'What is printed?',c:J`
int a = 7, b = 2;
double r = (double) a / b;
System.out.println(r);
`,o:['3.5','3.0','3','4.0'],v:'out',e:'The cast applies to `a` first (7.0), so the division is 7.0 / 2 = 3.5.'},
{t:'cast',d:2,q:'What is printed?',c:J`
int a = 7, b = 2;
double r = (double) (a / b);
System.out.println(r);
`,o:['3.0','3.5','3','4.0'],v:'out',e:'The parentheses make `a / b` happen first as integer division (3); casting 3 to double gives 3.0. The cast comes too late!'},
{t:'cast',d:2,q:'What is printed?',c:J`
System.out.println((char) 66);
`,o:['B','66','A','b'],v:'out',e:"Casting an int to char gives the character with that code: 65 is 'A', 66 is 'B'."},
{t:'cast',d:2,q:'What is printed?',c:J`
System.out.println((int) 'a');
`,o:['97','65','1','a'],v:'out',e:"Lowercase 'a' has code 97 (uppercase 'A' is 65)."},
{t:'cast',d:1,q:'What happens with this code?',c:J`
int x = 3.5;
System.out.println(x);
`,o:['Compilation error: possible lossy conversion from double to int','It prints 3','It prints 4','It prints 3.5'],v:'ce',e:'Java never narrows automatically. You must write `(int) 3.5` to show you accept losing the decimal part.'},
{t:'cast',d:2,q:'How do you convert the String `"42"` into an int?',oc:1,o:['Integer.parseInt("42")','(int) "42"','"42".toInt()','Int.parse("42")'],e:'A String cannot be cast to int. `Integer.parseInt` reads the text and returns the number. (Similarly, `Double.parseDouble` for doubles.)'},
{t:'cast',d:2,q:'Given `int n = 42;`, which line correctly makes a String from it?',oc:1,o:['String s = String.valueOf(n);','String s = (String) n;','String s = n;','String s = n.toString();'],e:'`String.valueOf(n)` (or the shortcut `"" + n`) works. A primitive int has no methods, so `n.toString()` does not compile, and an int cannot be cast to String.'},
{t:'cast',d:3,q:'What is printed?',c:J`
int big = 130;
byte b = (byte) big;
System.out.println(b);
`,o:['-126','130','127','Compilation error'],v:'out',e:'byte only goes up to 127. The cast keeps the low 8 bits, so 130 wraps around to 130 − 256 = −126.'},

`,vx:'7',e:'Casting truncates: `(int) 7.9` is 7. Use `Math.round` if you want rounding.'},

`,o:['5.0','5','Compilation error','5.00'],v:'out',e:'int → double is an automatic widening conversion. A double always prints with a decimal point.'},

`,o:['75','12','7','57'],v:'out',e:'n is the number 7. Then `7 + "5"` is int + String, which is concatenation: "75".'},

// ---------- 6. Scanner ----------
{t:'scanner',d:1,q:'Which import statement is needed to use Scanner?',oc:1,o:['import java.util.Scanner;','import java.io.Scanner;','import Scanner;','include java.util.Scanner;'],e:'Scanner lives in the java.util package. (`import java.util.*;` also works.)'},
{t:'scanner',d:1,q:'Which line creates a Scanner that reads from the keyboard?',oc:1,o:['Scanner sc = new Scanner(System.in);','Scanner sc = new Scanner(System.out);','Scanner sc = Scanner(System.in);','Scanner sc = new Scanner();'],e:'`System.in` is the standard input stream (the keyboard). You need `new` to create the object.'},
{t:'scanner',d:1,q:'Which method reads an int?',oc:1,o:['sc.nextInt()','sc.readInt()','sc.getInt()','sc.nextInteger()'],e:'Scanner methods are named next + Type: nextInt, nextDouble, nextLong, nextBoolean... plus next() and nextLine() for Strings.'},
{t:'scanner',d:1,q:'Which method reads a double?',oc:1,o:['sc.nextDouble()','sc.nextFloat64()','sc.readDouble()','sc.next(double)'],e:'nextDouble() reads the next token and converts it to a double.'},
{t:'scanner',d:2,q:'What is the difference between `next()` and `nextLine()`?',o:['`next()` reads one word (up to whitespace); `nextLine()` reads the rest of the current line','`next()` reads a whole line; `nextLine()` reads one word','`nextLine()` skips the current line and reads the following one','There is no difference'],e:'`next()` returns one token. `nextLine()` returns everything up to the end of the line (spaces included) and consumes the line break.'},
{t:'scanner',d:2,q:'The user types `Hello World` and presses Enter. What is printed?',c:J`

String s = sc.next();

`,in:'Hello World\n',o:['Hello','Hello World','World','Nothing; it waits for more input'],v:'out',e:'next() stops at the first whitespace, so it returns only "Hello".'},
{t:'scanner',d:3,q:'The user types `25`, presses Enter, then types `Alice` and presses Enter. What is printed?',c:J`

`,in:'25\nAlice\n',o:['[]','[Alice]','[25]','[ Alice]'],v:'out',e:'Classic trap! nextInt() reads 25 but leaves the Enter (line break) in the input. nextLine() then reads the rest of that line, which is empty. Fix: call an extra `sc.nextLine();` right after nextInt().'},
{t:'scanner',d:2,q:'The program calls `sc.nextInt()` and the user types `abc`. What happens?',c:J`
Scanner sc = new Scanner(System.in);
int n = sc.nextInt();

`,in:'abc\n',o:['An InputMismatchException is thrown','n becomes 0','n becomes -1','It prints abc'],v:'rt',e:'"abc" is not an int, so nextInt() throws java.util.InputMismatchException and the program crashes (unless you check first with hasNextInt()).'},
{t:'scanner',d:2,tf:1,a:true,q:'The String returned by `nextLine()` does NOT contain the line-break character at the end.',e:'nextLine() consumes the line break but does not include it in the returned String.'},
{t:'scanner',d:2,q:'Which method reads a boolean value such as `true`?',oc:1,o:['sc.nextBoolean()','sc.nextBool()','sc.readBoolean()','sc.next(boolean)'],e:'nextBoolean() accepts "true" or "false" (case-insensitive).'},
{t:'scanner',d:2,q:'Scanner has no `nextChar()` method. How do you read a single character?',oc:1,o:['char c = sc.next().charAt(0);','char c = sc.nextChar();','char c = sc.readChar();','char c = (char) sc.nextLine();'],e:'Read a word with next() and take its first character with charAt(0).'},
{t:'scanner',d:2,q:'The user types `3 4` and presses Enter. What is printed?',c:J`

`,in:'3 4\n',o:['7','34','3 4','An exception is thrown'],v:'out',e:'nextInt() splits the input on whitespace, so both numbers may be on the same line. a + b is int addition.'},
{t:'scanner',d:1,tf:1,a:false,q:'Scanner is in the `java.lang` package, so it can be used without an import.',e:'Only java.lang classes (String, Math, System, Integer...) are imported automatically. Scanner needs `import java.util.Scanner;`.'},
{t:'scanner',d:1,q:'In `new Scanner(System.in)`, what is `System.in`?',o:['The standard input stream, usually the keyboard','The screen','A file called "in"','The command-line arguments'],e:'System.in is standard input; System.out is standard output (the console).'},
{t:'scanner',d:3,q:'The user types `10 20 30` and presses Enter. What is printed?',c:J`

{t:'scanner',d:1,q:'What is good practice when you have completely finished reading input?',oc:1,o:['sc.close();','sc.end();','sc = 0;','delete sc;'],e:'close() releases the input stream. (Do not close a System.in Scanner if you still need input later.)'},
{t:'scanner',d:3,q:'The user types `Ana Maria` and presses Enter. What is printed?',c:J`

{t:'scanner',d:2,q:'Which method reads a `long` value?',oc:1,o:['sc.nextLong()','sc.nextInt64()','sc.readLong()','sc.nextBig()'],e:'Following the pattern next + Type.'},
{t:'scanner',d:3,q:'The user types `Hi there` and presses Enter. What is printed?',c:J`

`,in:'Hi there\n',o:['[Hi][ there]','[Hi][there]','[Hi there][]','[Hi][]'],v:'out',e:'next() takes "Hi" and stops before the space. nextLine() returns everything left on the line, including the leading space.'},

// ---------- 7. Conditionals ----------
{t:'cond',d:1,q:'What is printed?',c:J`

{t:'cond',d:2,q:'What is printed?',c:J`

}

{t:'cond',d:1,q:'What does the `default` label in a switch do?',o:['It runs when no case matches','It runs before every case','It runs after every case','It marks the first case'],e:'default is the "otherwise" branch of a switch. It is optional.'},
{t:'cond',d:3,q:'What is printed?',c:J`

`,o:['C','B\nC','A\nC','B'],v:'out',e:'An else always belongs to the nearest unmatched if (the inner one), whatever the indentation says. The outer condition x > 5 is false, so the whole inner if/else is skipped.'},
{t:'cond',d:2,q:'What happens with this code?',c:J`

{t:'cond',d:1,tf:1,a:false,q:'In Java, `if (1) { ... }` compiles, just like in C.',c:J`

`,v:'ce',e:'Java requires a boolean expression in conditions. An int is never accepted.'},
{t:'cond',d:2,q:'Which type CANNOT be used as the expression of a classic switch statement?',oc:1,o:['double','int','char','String'],e:'switch works with byte, short, char, int (and their wrapper classes), String and enums, but not with double, float, long or boolean.'},

  const modes = [['quiz', '?', 'Quiz', `${QUIZ.length} multiple-choice & true/false questions`], ['output', '>_', "What's the output?", `${OUTPUT.length} snippets: type the exact output`], ['bug', '🐞', 'Find the bug', `${BUGS.length} buggy programs: pick line + fix`], ['code', '{ }', 'Write the code', `${TASKS.length} tasks with hints & solutions`], ['mock', '⏱', 'Mock exam', '20 mixed questions · 60 minutes'], ['cheat', '📄', 'Cheat sheets', 'One page per topic with examples']];

      h('div', { class: 'card' }, h('div', { class: 'stats' }, h('div', { class: 'stat' }, h('b', {}, tot.a), h('span', {}, 'answered')), h('div', { class: 'stat' }, h('b', {}, tot.a ? pct(tot.c, tot.a) + '%' : '–'), h('span', {}, 'accuracy')), h('div', { class: 'stat' }, h('b', {}, best), h('span', {}, 'best mock'))),

/* ---------- router ---------- */
function route() {
  clearInterval(timerHandle); closeModal();
  const [r, arg] = (location.hash.slice(1) || 'home').split('-');
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + r));
  viewKeys = null;
  if (S && S.route === r) { S.finished ? renderResults() : renderSession(); return; }
  switch (r) {
    case 'quiz': case 'output': case 'bug': renderSetup(r); break;
    case 'code': arg != null ? renderTask(+arg) : renderCodeList(); break;
    case 'mock': renderMock(); break;
    case 'cheat': arg ? renderCheat(arg) : renderCheatIndex(); break;
    case 'progress': renderProgress(); break;
    default: renderHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  $('#themeBtn').addEventListener('click', toggleTheme);
  $('#helpBtn').addEventListener('click', showHelp);
  applyTheme(); route();
});
