<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TACOS POS – Gostivar</title>
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #22263a;
      --border:      #2e3347;
      --accent:      #f59e0b;
      --accent-dim:  #b45309;
      --red:         #ef4444;
      --green:       #22c55e;
      --blue:        #3b82f6;
      --text:        #f1f5f9;
      --text-muted:  #94a3b8;
      --radius:      10px;
      --radius-lg:   16px;
      --shadow:      0 4px 24px rgba(0,0,0,.5);
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }

    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    input, textarea, select { font-family: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; outline: none; width: 100%; }
    input:focus, textarea:focus { border-color: var(--accent); }

    /* ============================================================
       OVERLAY MODAL BACKDROP
    ============================================================ */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 9000;
      backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: min(420px, 95vw);
      box-shadow: var(--shadow);
      animation: popIn .18s ease;
    }
    @keyframes popIn {
      from { transform: scale(.94); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .modal label { display: block; font-size: .85rem; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }

    /* ============================================================
       STAFF LOGIN (first-load screen)
    ============================================================ */
    #staffOverlay { z-index: 9999; }
    #staffOverlay .modal { text-align: center; }
    #staffOverlay .logo { font-size: 2rem; font-weight: 800; letter-spacing: 2px; color: var(--accent); margin-bottom: 4px; }
    #staffOverlay .sub  { color: var(--text-muted); font-size: .9rem; margin-bottom: 24px; }
    #staffOverlay input { text-align: center; font-size: 1.1rem; }
    #staffOverlay .btn-primary { margin-top: 16px; width: 100%; }

    /* ============================================================
       LAYOUT – header + main area
    ============================================================ */
    #app { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }
    .header-brand { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
    .header-staff { font-size: .8rem; color: var(--text-muted); }
    .header-time   { font-size: .8rem; color: var(--text-muted); white-space: nowrap; }

    /* ============================================================
       NAV TABS
    ============================================================ */
    nav {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex: 1 0 auto;
      padding: 11px 14px;
      background: transparent;
      color: var(--text-muted);
      font-size: .82rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      min-width: 70px;
    }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
    nav button:hover:not(.active) { color: var(--text); }

    /* ============================================================
       MAIN CONTENT AREA
    ============================================================ */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ============================================================
       BUTTON STYLES
    ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius);
      font-size: .88rem;
      font-weight: 600;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { opacity: .9; }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:hover  { opacity: .85; }
    .btn-success { background: var(--green); color: #000; }
    .btn-success:hover { opacity: .85; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover   { background: var(--border); }
    .btn-sm { padding: 6px 11px; font-size: .8rem; }
    .btn-icon { padding: 7px; border-radius: 8px; }

    /* ============================================================
       BADGE
    ============================================================ */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
    }
    .badge-open    { background: #1e3a5f; color: #60a5fa; }
    .badge-kitchen { background: #451a03; color: #fb923c; }
    .badge-paid    { background: #14532d; color: #4ade80; }
    .badge-low     { background: #450a0a; color: #f87171; }

    /* ============================================================
       TAB: TABLES
    ============================================================ */
    .tables-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
    }
    .tables-header h2 { font-size: 1rem; }
    .tables-filter { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 600;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    .table-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      position: relative;
    }
    .table-card:active { transform: scale(.97); }
    .table-card.status-open     { border-color: var(--border); }
    .table-card.status-kitchen  { border-color: #fb923c; background: #1a130c; }
    .table-card.status-paid     { border-color: var(--border); opacity: .55; }
    .table-card:hover { border-color: var(--accent); }
    .table-num { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
    .table-status-txt { font-size: .72rem; color: var(--text-muted); }
    .table-amount { font-size: .78rem; color: var(--accent); font-weight: 700; margin-top: 3px; }

    /* ============================================================
       ORDER PANEL (slide-in from right)
    ============================================================ */
    #orderPanel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(480px, 100vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 800;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .22s ease;
      box-shadow: -8px 0 40px rgba(0,0,0,.5);
    }
    #orderPanel.open { transform: translateX(0); }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-header h3 { font-size: 1rem; }

    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-tab {
      flex: 1;
      padding: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: .82rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all .15s;
    }
    .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Menu inside panel */
    .menu-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .menu-search input { font-size: .9rem; }

    .menu-categories {
      display: flex; gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .menu-categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 5px 12px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 600;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .menu-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-content: start;
    }
    .menu-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      position: relative;
      overflow: hidden;
    }
    .menu-item:active { transform: scale(.97); }
    .menu-item:hover  { border-color: var(--accent); }
    .menu-item.low-stock { border-color: var(--red) !important; }
    .menu-item.out-of-stock { opacity: .4; pointer-events: none; }
    .mi-name { font-size: .85rem; font-weight: 700; margin-bottom: 2px; }
    .mi-price { font-size: .9rem; color: var(--accent); font-weight: 800; }
    .mi-low { font-size: .7rem; color: var(--red); font-weight: 600; margin-top: 2px; }

    /* Add-to-cart flash animation */
    @keyframes flashAdd {
      0%   { background: rgba(245,158,11,.35); }
      100% { background: transparent; }
    }
    .menu-item.flash { animation: flashAdd .4s ease forwards; }

    /* Order items list */
    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .order-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .oi-name { flex: 1; font-size: .88rem; font-weight: 600; }
    .oi-note { font-size: .75rem; color: var(--text-muted); }
    .oi-qty  { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .1s;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-num { font-weight: 700; min-width: 22px; text-align: center; }
    .oi-price { font-size: .88rem; font-weight: 700; color: var(--accent); min-width: 56px; text-align: right; }

    .panel-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .total-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .total-row span { font-size: .9rem; color: var(--text-muted); }
    .total-row strong { font-size: 1.3rem; color: var(--accent); }
    .panel-actions { display: flex; gap: 8px; }
    .panel-actions .btn { flex: 1; }

    /* ============================================================
       TAB: KDS – KITCHEN DISPLAY
    ============================================================ */
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .kds-card {
      background: var(--surface);
      border: 2px solid #fb923c;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .kds-card-header {
      background: #451a03;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .kds-table { font-weight: 800; font-size: 1rem; }
    .kds-time  { font-size: .78rem; color: #fb923c; }
    .kds-items { padding: 10px 14px; }
    .kds-row   { padding: 4px 0; font-size: .9rem; border-bottom: 1px solid var(--border); }
    .kds-row:last-child { border-bottom: none; }
    .kds-row .qty { color: var(--accent); font-weight: 700; margin-right: 6px; }
    .kds-note  { font-size: .75rem; color: var(--text-muted); font-style: italic; margin-left: 8px; }
    .kds-footer { padding: 8px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

    .kds-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .kds-empty .icon { font-size: 3rem; margin-bottom: 8px; }

    /* ============================================================
       TAB: HISTORY
    ============================================================ */
    .history-filters {
      display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
    }
    .history-filters input[type=date] { width: auto; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .history-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      gap: 8px;
    }
    .history-card-header:hover { background: var(--surface2); }
    .hc-left { display: flex; flex-direction: column; gap: 2px; }
    .hc-title { font-weight: 700; font-size: .9rem; }
    .hc-meta  { font-size: .75rem; color: var(--text-muted); }
    .hc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .hc-total { font-weight: 700; color: var(--accent); }
    .history-card-body { padding: 0 14px 12px; display: none; }
    .history-card-body.open { display: block; }
    .history-item-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: .85rem; border-bottom: 1px dashed var(--border); }
    .history-item-row:last-child { border-bottom: none; }

    /* ============================================================
       TAB: REPORTS
    ============================================================ */
    .report-date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .report-date-row input[type=date] { width: auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .stat-label { font-size: .75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    .report-section { margin-bottom: 20px; }
    .report-section h3 { font-size: .95rem; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .top-item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .ti-rank  { font-size: .8rem; color: var(--text-muted); width: 24px; }
    .ti-name  { flex: 1; font-weight: 600; font-size: .9rem; }
    .ti-qty   { font-size: .85rem; color: var(--text-muted); }
    .ti-rev   { font-size: .9rem; color: var(--accent); font-weight: 700; min-width: 70px; text-align: right; }

    /* ============================================================
       TAB: INVENTORY
    ============================================================ */
    .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .inv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .inv-card.low { border-color: var(--red); }
    .inv-name { font-weight: 700; font-size: .9rem; }
    .inv-stock { font-size: .85rem; color: var(--text-muted); }
    .inv-bar-bg { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .inv-bar { height: 100%; border-radius: 99px; transition: width .3s; }
    .inv-actions { display: flex; gap: 6px; margin-top: 4px; }
    .inv-actions input { padding: 5px 8px; font-size: .82rem; width: 64px; }

    /* ============================================================
       TOAST NOTIFICATION
    ============================================================ */
    #toastContainer {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 9500;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      pointer-events: none;
    }
    .toast {
      padding: 10px 20px;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 600;
      color: #000;
      animation: toastIn .2s ease, toastOut .3s ease 2.7s forwards;
      white-space: nowrap;
    }
    .toast-success { background: var(--green); }
    .toast-error   { background: var(--red); color: #fff; }
    .toast-info    { background: var(--accent); }
    @keyframes toastIn  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

    /* ============================================================
       CONFIRM DIALOG
    ============================================================ */
    #confirmOverlay .modal { width: min(360px, 92vw); }
    #confirmOverlay p { color: var(--text-muted); font-size: .9rem; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions .btn { flex: 1; }

    /* ============================================================
       NOTE INPUT POPUP (per order item)
    ============================================================ */
    #noteOverlay textarea { min-height: 80px; resize: vertical; }
    #noteOverlay .confirm-actions { margin-top: 12px; }

    /* ============================================================
       PRINT STYLES (thermal 80mm width)
    ============================================================ */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: fixed; top: 0; left: 0;
        width: 80mm;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: #000;
        padding: 6mm;
      }
      .print-logo    { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 4px; }
      .print-sub     { text-align: center; font-size: 11px; margin-bottom: 8px; }
      .print-divider { border-top: 1px dashed #000; margin: 6px 0; }
      .print-row     { display: flex; justify-content: space-between; }
      .print-total   { font-weight: bold; font-size: 14px; margin-top: 4px; }
      .print-footer  { text-align: center; font-size: 10px; margin-top: 8px; }
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .tables-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 7px; }
      .menu-list   { grid-template-columns: 1fr; }
      .kds-grid    { grid-template-columns: 1fr; }
      .stats-grid  { grid-template-columns: 1fr 1fr; }
      main { padding: 10px; }
    }

    /* Scrollbar style */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .hidden { display: none !important; }
    .page   { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

<!-- ============================================================
     STAFF LOGIN OVERLAY
============================================================ -->
<div class="overlay" id="staffOverlay">
  <div class="modal">
    <div class="logo">🌮 TACOS</div>
    <div class="sub">Gostivar – POS System</div>
    <label for="staffNameInput">Enter your name to continue</label>
    <input id="staffNameInput" type="text" placeholder="Your name..." maxlength="30" autocomplete="off" />
    <button class="btn btn-primary" onclick="startSession()">Start Shift</button>
  </div>
</div>

<!-- ============================================================
     CONFIRM DIALOG
============================================================ -->
<div class="overlay hidden" id="confirmOverlay">
  <div class="modal" id="confirmModal">
    <h2 id="confirmTitle">Confirm</h2>
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="resolveConfirm(false)">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn" onclick="resolveConfirm(true)">Confirm</button>
    </div>
  </div>
</div>

<!-- ============================================================
     NOTE INPUT DIALOG
============================================================ -->
<div class="overlay hidden" id="noteOverlay">
  <div class="modal">
    <h2>Add Note</h2>
    <label>Special instructions for this item:</label>
    <textarea id="noteInput" placeholder="e.g. no onions, extra sauce..."></textarea>
    <div class="confirm-actions" style="margin-top:12px">
      <button class="btn btn-ghost" onclick="closeNoteDialog(false)">Cancel</button>
      <button class="btn btn-primary" onclick="closeNoteDialog(true)">Save Note</button>
    </div>
  </div>
</div>

<!-- ============================================================
     PRINT AREA (invisible except during print)
============================================================ -->
<div id="printArea" style="display:none"></div>

<!-- ============================================================
     TOAST CONTAINER
============================================================ -->
<div id="toastContainer"></div>

<!-- ============================================================
     MAIN APP
============================================================ -->
<div id="app">
  <header>
    <span class="header-brand">🌮 TACOS</span>
    <span class="header-staff" id="headerStaff"></span>
    <span class="header-time"  id="headerTime"></span>
  </header>

  <nav id="mainNav">
    <button class="active" data-page="tables">Tables</button>
    <button data-page="kds">Kitchen</button>
    <button data-page="history">History</button>
    <button data-page="reports">Reports</button>
    <button data-page="inventory">Inventory</button>
  </nav>

  <main id="mainContent">
    <!-- TABLES PAGE -->
    <div class="page active" id="page-tables">
      <div class="tables-header">
        <h2>Floor Plan</h2>
        <div class="tables-filter">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="open">Open</button>
          <button class="filter-btn" data-filter="kitchen">In Kitchen</button>
          <button class="filter-btn" data-filter="paid">Paid</button>
        </div>
      </div>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>

    <!-- KDS PAGE -->
    <div class="page" id="page-kds">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="font-size:1rem">Kitchen Display</h2>
        <button class="btn btn-ghost btn-sm" onclick="renderKDS()">↻ Refresh</button>
      </div>
      <div class="kds-grid" id="kdsGrid"></div>
    </div>

    <!-- HISTORY PAGE -->
    <div class="page" id="page-history">
      <div class="history-filters">
        <input type="date" id="historyDate" onchange="renderHistory()" />
        <button class="btn btn-ghost btn-sm" onclick="clearHistoryFilter()">All Time</button>
        <button class="btn btn-ghost btn-sm" onclick="exportHistory()">⬇ Export CSV</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <!-- REPORTS PAGE -->
    <div class="page" id="page-reports">
      <div class="report-date-row">
        <input type="date" id="reportDate" />
        <button class="btn btn-primary btn-sm" onclick="renderReports()">Generate</button>
        <button class="btn btn-ghost btn-sm" onclick="exportReport()">⬇ Export Word</button>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <div id="reportBody"></div>
    </div>

    <!-- INVENTORY PAGE -->
    <div class="page" id="page-inventory">
      <div class="inv-header">
        <h2 style="font-size:1rem">Inventory</h2>
        <button class="btn btn-ghost btn-sm" onclick="showAddInventory()">+ Add Item</button>
      </div>
      <div class="inv-grid" id="invGrid"></div>
    </div>
  </main>
</div>

<!-- ============================================================
     ORDER PANEL
============================================================ -->
<div id="orderPanel">
  <div class="panel-header">
    <h3 id="panelTitle">Table –</h3>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="printBill()">🖨 Bill</button>
      <button class="btn btn-ghost btn-icon" onclick="closeOrderPanel()">✕</button>
    </div>
  </div>
  <div class="panel-tabs">
    <button class="panel-tab active" data-ptab="order" onclick="switchPanelTab('order')">Order</button>
    <button class="panel-tab"        data-ptab="menu"  onclick="switchPanelTab('menu')">Add Items</button>
  </div>

  <!-- ORDER TAB -->
  <div id="ptab-order" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="order-list" id="orderList"></div>
    <div class="panel-footer">
      <div class="total-row">
        <span>Total</span>
        <strong id="orderTotal">MKD 0</strong>
      </div>
      <div class="panel-actions">
        <button class="btn btn-danger btn-sm" onclick="voidOrder()">✕ Void</button>
        <button class="btn btn-ghost"         onclick="sendToKitchen()">🔥 Send</button>
        <button class="btn btn-success"       onclick="recordPayment()">💳 Pay</button>
      </div>
    </div>
  </div>

  <!-- MENU TAB -->
  <div id="ptab-menu" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div class="menu-search">
      <input type="text" id="menuSearch" placeholder="Search menu…" oninput="filterMenu()" />
    </div>
    <div class="menu-categories" id="menuCats"></div>
    <div class="menu-list" id="menuList"></div>
  </div>
</div>

<script>
/* ================================================================
   STATE & CONSTANTS
================================================================ */
const TABLES_COUNT = 50;

// Default menu data (emoji as placeholder for photos)
const DEFAULT_MENU = [
  { id: 1,  name: 'Classic Taco',      cat: 'Tacos',    price: 120, emoji: '🌮', inv: 'Tortillas' },
  { id: 2,  name: 'Spicy Taco',        cat: 'Tacos',    price: 130, emoji: '🌶', inv: 'Tortillas' },
  { id: 3,  name: 'Chicken Taco',      cat: 'Tacos',    price: 140, emoji: '🍗', inv: 'Chicken'   },
  { id: 4,  name: 'Veggie Taco',       cat: 'Tacos',    price: 110, emoji: '🥦', inv: null         },
  { id: 5,  name: 'Beef Burrito',      cat: 'Burritos', price: 190, emoji: '🌯', inv: 'Beef'      },
  { id: 6,  name: 'Chicken Burrito',   cat: 'Burritos', price: 185, emoji: '🌯', inv: 'Chicken'   },
  { id: 7,  name: 'Veggie Burrito',    cat: 'Burritos', price: 165, emoji: '🌯', inv: null         },
  { id: 8,  name: 'Classic Burger',    cat: 'Burgers',  price: 220, emoji: '🍔', inv: 'Beef'      },
  { id: 9,  name: 'Chicken Burger',    cat: 'Burgers',  price: 215, emoji: '🍔', inv: 'Chicken'   },
  { id: 10, name: 'Double Smash',      cat: 'Burgers',  price: 280, emoji: '🍔', inv: 'Beef'      },
  { id: 11, name: 'Club Toast',        cat: 'Toasts',   price: 160, emoji: '🥪', inv: 'Bread'     },
  { id: 12, name: 'Cheese Toast',      cat: 'Toasts',   price: 140, emoji: '🥪', inv: 'Bread'     },
  { id: 13, name: 'Coca-Cola 0.33L',   cat: 'Drinks',   price: 70,  emoji: '🥤', inv: null         },
  { id: 14, name: 'Fanta 0.33L',       cat: 'Drinks',   price: 70,  emoji: '🥤', inv: null         },
  { id: 15, name: 'Water 0.5L',        cat: 'Drinks',   price: 50,  emoji: '💧', inv: null         },
  { id: 16, name: 'Fresh Juice',       cat: 'Drinks',   price: 110, emoji: '🍊', inv: null         },
  { id: 17, name: 'Nachos',            cat: 'Sides',    price: 120, emoji: '🍿', inv: null         },
  { id: 18, name: 'French Fries',      cat: 'Sides',    price: 100, emoji: '🍟', inv: null         },
];

const DEFAULT_INVENTORY = [
  { name: 'Tortillas', qty: 100, unit: 'pcs',  low: 20  },
  { name: 'Beef',      qty: 5,   unit: 'kg',   low: 2   },
  { name: 'Chicken',   qty: 4,   unit: 'kg',   low: 2   },
  { name: 'Bread',     qty: 30,  unit: 'pcs',  low: 10  },
  { name: 'Cheese',    qty: 3,   unit: 'kg',   low: 1   },
  { name: 'Veggies',   qty: 2,   unit: 'kg',   low: 0.5 },
];

// How much inventory each category item consumes per order
const INVENTORY_COSTS = {
  'Tacos':   { Tortillas: 2 },
  'Burritos':{ Tortillas: 1 },
  'Burgers': { Beef: 0.2, Chicken: 0.2 },
  'Toasts':  { Bread: 2 },
};

/* App state */
let state = {
  staff:     '',
  tables:    {},  // { [tableId]: { status, items, sentAt, paidAt } }
  history:   [],  // paid orders
  inventory: [],
  menu:      [],
};

// Active UI state (not persisted)
let ui = {
  openTable:    null,
  panelTab:     'order',
  menuCat:      'All',
  tableFilter:  'all',
  confirmResolve: null,
  noteResolve:    null,
  noteTarget:     null,   // { tableId, itemIndex }
};

/* ================================================================
   PERSISTENCE (localStorage)
================================================================ */
function save() {
  localStorage.setItem('tacos_state', JSON.stringify(state));
}

function load() {
  const raw = localStorage.getItem('tacos_state');
  if (raw) {
    try {
      const saved = JSON.parse(raw);
      // Merge to pick up any new defaults
      state.staff     = saved.staff     || '';
      state.tables    = saved.tables    || {};
      state.history   = saved.history   || [];
      state.inventory = saved.inventory && saved.inventory.length ? saved.inventory : DEFAULT_INVENTORY;
      state.menu      = saved.menu      && saved.menu.length      ? saved.menu      : DEFAULT_MENU;
    } catch { /* corrupted – use defaults */ }
  } else {
    state.inventory = DEFAULT_INVENTORY;
    state.menu      = DEFAULT_MENU;
  }
}

/* ================================================================
   INITIALIZATION
================================================================ */
function init() {
  load();

  // Staff login gate
  if (!state.staff) {
    document.getElementById('staffOverlay').classList.remove('hidden');
    const inp = document.getElementById('staffNameInput');
    inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') startSession(); });
    return; // Don't render UI yet
  }

  launchApp();
}

function startSession() {
  const name = document.getElementById('staffNameInput').value.trim();
  if (!name) { toast('Please enter your name', 'error'); return; }
  state.staff = name;
  save();
  document.getElementById('staffOverlay').classList.add('hidden');
  launchApp();
}

function launchApp() {
  document.getElementById('headerStaff').textContent = '👤 ' + state.staff;

  // Wire nav tabs
  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.addEventListener('click', () => switchPage(btn.dataset.page));
  });
  // Wire table filters
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ui.tableFilter = btn.dataset.filter;
      renderTables();
    });
  });

  // Set today's date on report/history inputs
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('reportDate').value  = today;
  document.getElementById('historyDate').value = today;

  renderTables();
  renderKDS();
  renderHistory();
  renderReports();
  renderInventory();
  buildMenuCats();
  renderMenu();

  // Live clock
  updateClock();
  setInterval(updateClock, 1000);
}

function updateClock() {
  const now = new Date();
  document.getElementById('headerTime').textContent =
    now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

/* ================================================================
   PAGE NAVIGATION
================================================================ */
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('#mainNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  // Refresh data on page visit
  if (page === 'kds')       renderKDS();
  if (page === 'history')   renderHistory();
  if (page === 'reports')   renderReports();
  if (page === 'inventory') renderInventory();
}

/* ================================================================
   TABLES
================================================================ */
function getTable(id) {
  if (!state.tables[id]) {
    state.tables[id] = { status: 'open', items: [], sentAt: null, paidAt: null, staff: state.staff };
  }
  return state.tables[id];
}

function tableStatus(id) {
  const t = state.tables[id];
  if (!t || !t.items || t.items.length === 0) return 'open';
  return t.status || 'open';
}

function tableTotal(id) {
  const t = state.tables[id];
  if (!t || !t.items) return 0;
  return t.items.reduce((s, i) => s + i.price * i.qty, 0);
}

function renderTables() {
  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= TABLES_COUNT; i++) {
    const status = tableStatus(i);
    if (ui.tableFilter !== 'all' && status !== ui.tableFilter) continue;

    const total = tableTotal(i);
    const statusLabel = { open: 'Open', kitchen: 'In Kitchen', paid: 'Paid' }[status];

    const card = document.createElement('div');
    card.className = `table-card status-${status}`;
    card.innerHTML = `
      <div class="table-num">${i}</div>
      <div class="table-status-txt">${statusLabel}</div>
      ${total > 0 ? `<div class="table-amount">MKD ${total}</div>` : ''}
    `;
    card.addEventListener('click', () => openTable(i));
    grid.appendChild(card);
  }
}

/* ================================================================
   ORDER PANEL
================================================================ */
function openTable(id) {
  ui.openTable = id;
  document.getElementById('panelTitle').textContent = `Table ${id}`;
  switchPanelTab('order');
  renderOrderList();
  document.getElementById('orderPanel').classList.add('open');
}

function closeOrderPanel() {
  document.getElementById('orderPanel').classList.remove('open');
  ui.openTable = null;
}

function switchPanelTab(tab) {
  ui.panelTab = tab;
  document.querySelectorAll('.panel-tab').forEach(b => b.classList.toggle('active', b.dataset.ptab === tab));
  document.getElementById('ptab-order').style.display = tab === 'order' ? 'flex' : 'none';
  document.getElementById('ptab-menu').style.display  = tab === 'menu'  ? 'flex' : 'none';
  if (tab === 'menu') renderMenu();
}

function renderOrderList() {
  const table = getTable(ui.openTable);
  const list  = document.getElementById('orderList');
  list.innerHTML = '';

  if (!table.items.length) {
    list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted)">No items yet.<br>Tap "Add Items" to start.</div>';
  } else {
    table.items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'order-item';
      row.innerHTML = `
        <div style="flex:1">
          <div class="oi-name">${item.name}</div>
          ${item.note ? `<div class="oi-note">📝 ${item.note}</div>` : ''}
        </div>
        <div class="oi-qty">
          <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
        </div>
        <div class="oi-price">MKD ${item.price * item.qty}</div>
        <button class="btn btn-ghost btn-icon" style="font-size:.75rem" onclick="editNote(${idx})" title="Add note">📝</button>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('orderTotal').textContent =
    'MKD ' + table.items.reduce((s, i) => s + i.price * i.qty, 0);
}

function changeQty(itemIdx, delta) {
  const table = getTable(ui.openTable);
  table.items[itemIdx].qty += delta;
  if (table.items[itemIdx].qty <= 0) table.items.splice(itemIdx, 1);
  save();
  renderOrderList();
  renderTables();
}

function addItemToOrder(menuItem) {
  if (!ui.openTable) return;
  const table = getTable(ui.openTable);

  // Check low stock before adding
  if (menuItem.inv) {
    const inv = state.inventory.find(i => i.name === menuItem.inv);
    if (inv && inv.qty <= 0) { toast(`${menuItem.inv} is out of stock!`, 'error'); return; }
    if (inv && inv.qty <= inv.low) toast(`Low stock: ${menuItem.inv}`, 'info');
  }

  // Increment qty if already in order, else push new
  const existing = table.items.find(i => i.id === menuItem.id);
  if (existing) {
    existing.qty++;
  } else {
    table.items.push({ id: menuItem.id, name: menuItem.name, price: menuItem.price, qty: 1, note: '' });
  }

  save();
  renderOrderList();
  renderTables();
  toast(`+${menuItem.name}`, 'success');
}

/* ================================================================
   SEND TO KITCHEN
================================================================ */
function sendToKitchen() {
  const table = getTable(ui.openTable);
  if (!table.items.length) { toast('Order is empty', 'error'); return; }
  table.status = 'kitchen';
  table.sentAt = new Date().toISOString();
  save();
  renderOrderList();
  renderTables();
  renderKDS();
  toast(`Table ${ui.openTable} sent to kitchen 🔥`, 'success');
}

/* ================================================================
   RECORD PAYMENT
================================================================ */
function recordPayment() {
  const table = getTable(ui.openTable);
  if (!table.items.length) { toast('Order is empty', 'error'); return; }

  confirm2('Record Payment', `Mark Table ${ui.openTable} as paid?`, 'Pay').then(ok => {
    if (!ok) return;

    // Deduct inventory
    table.items.forEach(item => {
      const menuDef = state.menu.find(m => m.id === item.id);
      if (!menuDef || !menuDef.cat) return;
      const costs = INVENTORY_COSTS[menuDef.cat];
      if (!costs) return;
      Object.entries(costs).forEach(([ingr, cost]) => {
        const inv = state.inventory.find(i => i.name === ingr);
        if (inv) inv.qty = Math.max(0, inv.qty - cost * item.qty);
      });
    });

    // Archive to history
    state.history.push({
      id:       Date.now(),
      tableId:  ui.openTable,
      staff:    state.staff,
      items:    JSON.parse(JSON.stringify(table.items)),
      total:    table.items.reduce((s, i) => s + i.price * i.qty, 0),
      sentAt:   table.sentAt,
      paidAt:   new Date().toISOString(),
    });

    // Reset table
    state.tables[ui.openTable] = { status: 'open', items: [], sentAt: null, paidAt: null };
    save();
    renderTables();
    renderInventory();
    closeOrderPanel();
    toast(`Table ${ui.openTable} paid ✓`, 'success');
  });
}

/* ================================================================
   VOID / CANCEL ORDER
================================================================ */
function voidOrder() {
  const table = getTable(ui.openTable);
  if (!table.items.length) { toast('Nothing to void', 'error'); return; }

  confirm2('Void Order', `Cancel all items on Table ${ui.openTable}?`, 'Void').then(ok => {
    if (!ok) return;
    state.tables[ui.openTable] = { status: 'open', items: [], sentAt: null, paidAt: null };
    save();
    renderOrderList();
    renderTables();
    renderKDS();
    toast(`Table ${ui.openTable} order voided`, 'info');
  });
}

/* ================================================================
   NOTES
================================================================ */
function editNote(itemIdx) {
  ui.noteTarget = itemIdx;
  const table = getTable(ui.openTable);
  document.getElementById('noteInput').value = table.items[itemIdx]?.note || '';
  document.getElementById('noteOverlay').classList.remove('hidden');
  document.getElementById('noteInput').focus();
}

function closeNoteDialog(save_) {
  document.getElementById('noteOverlay').classList.add('hidden');
  if (save_ && ui.noteTarget !== null) {
    const table = getTable(ui.openTable);
    if (table.items[ui.noteTarget]) {
      table.items[ui.noteTarget].note = document.getElementById('noteInput').value.trim();
      save();
      renderOrderList();
    }
  }
  ui.noteTarget = null;
}

/* ================================================================
   MENU (inside panel)
================================================================ */
function buildMenuCats() {
  const cats = ['All', ...new Set(state.menu.map(m => m.cat))];
  const container = document.getElementById('menuCats');
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === ui.menuCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      ui.menuCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
      renderMenu();
    };
    container.appendChild(btn);
  });
}

function filterMenu() {
  renderMenu();
}

function renderMenu() {
  const search  = (document.getElementById('menuSearch')?.value || '').toLowerCase();
  const list    = document.getElementById('menuList');
  list.innerHTML = '';

  const filtered = state.menu.filter(item => {
    const matchCat    = ui.menuCat === 'All' || item.cat === ui.menuCat;
    const matchSearch = !search || item.name.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  filtered.forEach(item => {
    const inv   = item.inv ? state.inventory.find(i => i.name === item.inv) : null;
    const isLow = inv && inv.qty <= inv.low;
    const isOut = inv && inv.qty <= 0;

    const el = document.createElement('div');
    el.className = 'menu-item' + (isLow ? ' low-stock' : '') + (isOut ? ' out-of-stock' : '');
    el.innerHTML = `
      <div style="font-size:1.6rem;margin-bottom:4px">${item.emoji || '🍽'}</div>
      <div class="mi-name">${item.name}</div>
      <div class="mi-price">MKD ${item.price}</div>
      ${isLow && !isOut ? `<div class="mi-low">⚠ Low stock</div>` : ''}
      ${isOut           ? `<div class="mi-low">✗ Out of stock</div>` : ''}
    `;
    el.addEventListener('click', () => {
      addItemToOrder(item);
      // Flash animation feedback
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 400);
    });
    list.appendChild(el);
  });
}

/* ================================================================
   KITCHEN DISPLAY (KDS)
================================================================ */
function renderKDS() {
  const grid = document.getElementById('kdsGrid');
  grid.innerHTML = '';

  const active = Object.entries(state.tables).filter(([, t]) => t.status === 'kitchen' && t.items.length);
  if (!active.length) {
    grid.innerHTML = '<div class="kds-empty"><div class="icon">✓</div><div>Kitchen is clear</div></div>';
    return;
  }

  active.forEach(([tableId, table]) => {
    const elapsed = table.sentAt ? Math.floor((Date.now() - new Date(table.sentAt)) / 60000) : 0;
    const card = document.createElement('div');
    card.className = 'kds-card';
    card.innerHTML = `
      <div class="kds-card-header">
        <span class="kds-table">Table ${tableId}</span>
        <span class="kds-time">${elapsed}m ago · ${table.staff || ''}</span>
      </div>
      <div class="kds-items">
        ${table.items.map(i => `
          <div class="kds-row">
            <span class="qty">${i.qty}×</span>${i.name}
            ${i.note ? `<span class="kds-note">${i.note}</span>` : ''}
          </div>`).join('')}
      </div>
      <div class="kds-footer">
        <button class="btn btn-success btn-sm" style="flex:1" onclick="markReady(${tableId})">✓ Mark Ready</button>
        <button class="btn btn-ghost btn-sm" onclick="printKitchenTicket(${tableId})">🖨 Print</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function markReady(tableId) {
  const table = state.tables[tableId];
  if (!table) return;
  // Move status back to 'open' (served) – not paid yet
  table.status = 'open';
  save();
  renderKDS();
  renderTables();
  toast(`Table ${tableId} marked ready`, 'success');
}

/* ================================================================
   HISTORY
================================================================ */
function renderHistory() {
  const list     = document.getElementById('historyList');
  const dateVal  = document.getElementById('historyDate').value;
  list.innerHTML = '';

  const filtered = state.history.filter(o => {
    if (!dateVal) return true;
    return o.paidAt && o.paidAt.startsWith(dateVal);
  }).reverse();

  if (!filtered.length) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">No orders found</div>';
    return;
  }

  filtered.forEach(order => {
    const time = new Date(order.paidAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const card = document.createElement('div');
    card.className = 'history-card';
    card.innerHTML = `
      <div class="history-card-header" onclick="toggleHistoryCard(this)">
        <div class="hc-left">
          <div class="hc-title">Table ${order.tableId}</div>
          <div class="hc-meta">${time} · ${order.staff}</div>
        </div>
        <div class="hc-right">
          <div class="hc-total">MKD ${order.total}</div>
          <div style="font-size:.72rem;color:var(--text-muted)">${order.items.length} item(s)</div>
        </div>
      </div>
      <div class="history-card-body">
        ${order.items.map(i => `
          <div class="history-item-row">
            <span>${i.qty}× ${i.name}</span>
            <span>MKD ${i.price * i.qty}</span>
          </div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-ghost btn-sm" onclick="printBillForOrder(${order.id})">🖨 Re-print</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleHistoryCard(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

function clearHistoryFilter() {
  document.getElementById('historyDate').value = '';
  renderHistory();
}

/* ================================================================
   REPORTS
================================================================ */
function renderReports() {
  const dateVal  = document.getElementById('reportDate').value;
  const orders   = state.history.filter(o => !dateVal || (o.paidAt && o.paidAt.startsWith(dateVal)));

  const revenue  = orders.reduce((s, o) => s + o.total, 0);
  const numOrders = orders.length;
  const avgTicket = numOrders ? Math.round(revenue / numOrders) : 0;

  // Item sales aggregation
  const itemMap = {};
  orders.forEach(o => o.items.forEach(i => {
    if (!itemMap[i.name]) itemMap[i.name] = { qty: 0, rev: 0, price: i.price };
    itemMap[i.name].qty += i.qty;
    itemMap[i.name].rev += i.price * i.qty;
  }));
  const topItems = Object.entries(itemMap).sort((a, b) => b[1].qty - a[1].qty);

  // Stats
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value">MKD ${revenue}</div></div>
    <div class="stat-card"><div class="stat-label">Orders</div><div class="stat-value">${numOrders}</div></div>
    <div class="stat-card"><div class="stat-label">Avg Ticket</div><div class="stat-value">MKD ${avgTicket}</div></div>
    <div class="stat-card"><div class="stat-label">Items Sold</div><div class="stat-value">${orders.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0)}</div></div>
  `;

  // Top-selling items
  const body = document.getElementById('reportBody');
  if (!topItems.length) { body.innerHTML = '<div style="color:var(--text-muted);padding:20px 0">No data</div>'; return; }

  body.innerHTML = `
    <div class="report-section">
      <h3>Top-Selling Items</h3>
      ${topItems.map(([name, data], idx) => `
        <div class="top-item-row">
          <span class="ti-rank">#${idx + 1}</span>
          <span class="ti-name">${name}</span>
          <span class="ti-qty">${data.qty} sold</span>
          <span class="ti-rev">MKD ${data.rev}</span>
        </div>`).join('')}
    </div>
  `;
}

/* ================================================================
   INVENTORY
================================================================ */
function renderInventory() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '';

  state.inventory.forEach((item, idx) => {
    const pct    = Math.min(100, Math.round((item.qty / Math.max(item.qty, item.low * 3 || 10)) * 100));
    const isLow  = item.qty <= item.low;
    const color  = isLow ? '#ef4444' : item.qty <= item.low * 1.5 ? '#f59e0b' : '#22c55e';

    const card = document.createElement('div');
    card.className = 'inv-card' + (isLow ? ' low' : '');
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="inv-name">${item.name}</span>
        ${isLow ? '<span class="badge badge-low">Low</span>' : ''}
      </div>
      <div class="inv-stock">${item.qty} ${item.unit} remaining</div>
      <div class="inv-bar-bg"><div class="inv-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="inv-actions">
        <input type="number" id="inv-qty-${idx}" value="${item.qty}" min="0" step="0.5" style="width:72px" />
        <button class="btn btn-ghost btn-sm" onclick="updateInventory(${idx})">Save</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateInventory(idx) {
  const val = parseFloat(document.getElementById(`inv-qty-${idx}`).value);
  if (isNaN(val) || val < 0) { toast('Invalid value', 'error'); return; }
  state.inventory[idx].qty = val;
  save();
  renderInventory();
  renderMenu(); // refresh low-stock indicators in menu
  toast('Inventory updated', 'success');
}

function showAddInventory() {
  // Inline prompt – simple approach
  const name = prompt('Item name:');
  if (!name) return;
  const unit = prompt('Unit (pcs / kg / L):') || 'pcs';
  const qty  = parseFloat(prompt('Current quantity:') || '0');
  const low  = parseFloat(prompt('Low-stock threshold:') || '5');
  state.inventory.push({ name, unit, qty: isNaN(qty)?0:qty, low: isNaN(low)?5:low });
  save();
  renderInventory();
  toast(`${name} added to inventory`, 'success');
}

/* ================================================================
   PRINT – KITCHEN TICKET
================================================================ */
function printKitchenTicket(tableId) {
  const table = state.tables[tableId];
  if (!table) return;
  const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  document.getElementById('printArea').innerHTML = `
    <div class="print-logo">KITCHEN TICKET</div>
    <div class="print-sub">Table ${tableId} · ${time} · ${table.staff || state.staff}</div>
    <div class="print-divider"></div>
    ${table.items.map(i => `
      <div class="print-row">
        <span>${i.qty}× ${i.name}</span>
        ${i.note ? `<span style="font-style:italic">${i.note}</span>` : ''}
      </div>`).join('')}
    <div class="print-divider"></div>
    <div class="print-footer">*** KITCHEN COPY ***</div>
  `;
  window.print();
}

/* ================================================================
   PRINT – CUSTOMER BILL
================================================================ */
function printBill() {
  if (!ui.openTable) return;
  const table = getTable(ui.openTable);
  printBillData(ui.openTable, table.items);
}

function printBillForOrder(orderId) {
  const order = state.history.find(o => o.id === orderId);
  if (!order) return;
  printBillData(order.tableId, order.items);
}

function printBillData(tableId, items) {
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const time  = new Date().toLocaleString('en-GB');

  document.getElementById('printArea').innerHTML = `
    <div class="print-logo">🌮 TACOS</div>
    <div class="print-sub">Gostivar, North Macedonia</div>
    <div class="print-divider"></div>
    <div class="print-row"><span>Table</span><span>${tableId}</span></div>
    <div class="print-row"><span>Date</span><span>${time}</span></div>
    <div class="print-row"><span>Staff</span><span>${state.staff}</span></div>
    <div class="print-divider"></div>
    ${items.map(i => `
      <div class="print-row">
        <span>${i.qty}× ${i.name}</span>
        <span>MKD ${i.price * i.qty}</span>
      </div>
      ${i.note ? `<div style="font-size:10px;padding-left:8px;font-style:italic">Note: ${i.note}</div>` : ''}`).join('')}
    <div class="print-divider"></div>
    <div class="print-row print-total"><span>TOTAL</span><span>MKD ${total}</span></div>
    <div class="print-divider"></div>
    <div class="print-footer">Thank you for visiting TACOS!</div>
    <div class="print-footer">Please come again 🌮</div>
  `;
  window.print();
}

/* ================================================================
   EXPORT – CSV HISTORY
================================================================ */
function exportHistory() {
  const dateVal = document.getElementById('historyDate').value;
  const orders  = state.history.filter(o => !dateVal || o.paidAt?.startsWith(dateVal));

  let csv = 'Table,Staff,Item,Qty,Price,Total,Paid At\n';
  orders.forEach(o => {
    o.items.forEach(i => {
      csv += `${o.tableId},${o.staff},"${i.name}",${i.qty},${i.price},${i.price*i.qty},${o.paidAt}\n`;
    });
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `tacos-history-${dateVal || 'all'}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ================================================================
   TOAST NOTIFICATIONS
================================================================ */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ================================================================
   CONFIRM DIALOG (promise-based)
================================================================ */
function confirm2(title, msg, okLabel = 'Confirm', dangerous = true) {
  document.getElementById('confirmTitle').textContent  = title;
  document.getElementById('confirmMsg').textContent    = msg;
  document.getElementById('confirmOkBtn').textContent  = okLabel;
  document.getElementById('confirmOkBtn').className    = `btn ${dangerous ? 'btn-danger' : 'btn-primary'}`;
  document.getElementById('confirmOverlay').classList.remove('hidden');

  return new Promise(resolve => {
    ui.confirmResolve = resolve;
  });
}

function resolveConfirm(val) {
  document.getElementById('confirmOverlay').classList.add('hidden');
  if (ui.confirmResolve) { ui.confirmResolve(val); ui.confirmResolve = null; }
}
