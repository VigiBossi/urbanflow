    if (!ok){ inst.disabled.add(ans); btn.disabled=true; }
  } else if (q.t==="count"){
    const v=String(ans).trim(); if (v===""||isNaN(+v)){ fbw.innerHTML=fb("info","Type a whole number."); return; }
    ok=+v===inst.expected;
  } else {
    const r=checkExpr(q.expr,ans);
    if (r.status==="syntax"||r.status==="error"){
      fbw.innerHTML=fb("info",r.status==="syntax"?"I can't read that expression yet (this doesn't count as an attempt)":"Your expression can't be evaluated (this doesn't count as an attempt)",
        `<div>${esc(r.msg)}</div>${r.where?`<div class="small muted">Problem in: <code>${esc(plain(r.where))}</code></div>`:""}`);
      return;
    }
    ok=r.status==="ok";
    if (r.status==="wrong") extra=`<div>${esc(r.why)}</div><div class="small muted" style="margin-top:6px">Your expression evaluates to:</div>${tableHTML(r.user)}`;
    if (r.status==="variant") extra=`<div>${VARIANT_MSG}</div>`;
    if (ok){
      let same=false; try { same=plain(parse(ans))===plain(parse(q.expr)); } catch(e){}
      extra=same?"":`<div>Your expression is different from the model answer but gives the same result — on the sample data and on hidden test data. Both are correct.</div>`;
    }
  }
  if (ok){
    inst.done=true; record(q,inst.attempt===0,true);
    fbw.innerHTML=fb("ok",inst.attempt===0?"✓ Correct!":"✓ Correct on the second try (½ point).",extra);
    finishQ();
  } else if (inst.attempt===0){
    inst.attempt=1;
    fbw.innerHTML=fb("hint","Not quite — here is a hint. Try once more.",`<div>💡 ${q.hint}</div>${extra}`);
  } else {
    inst.done=true; record(q,false,false);
    let correct="";
    if (q.t==="count") correct=`The answer is <b>${inst.expected}</b>.`;
    if (q.t==="write") correct=`A correct answer:`+exprBlock(q.expr);
    fbw.innerHTML=fb("bad","✗ Not correct. Here is the full answer.",extra+correct);
    finishQ();
  }
}
function finishQ(){
  const card=$("#qcard"), inst=P.inst;
  card.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if (inst.opts&&inst.opts[+b.dataset.i].ok) b.classList.add("right"); });
  card.querySelectorAll(".ans").forEach(a=>a.readOnly=true);
  const cb=$("#checkbtn"); if (cb) cb.remove();
  const nb=$("#nextbtn"); nb.textContent="Next question →"; nb.classList.remove("ghost");
  card.querySelector(".expwrap").innerHTML=explainHTML(inst);
  nb.focus({preventScroll:true});
}

/* =====================================================================
   8. EXAM MODE
   ===================================================================== */
const EXAM_N=10, EXAM_SEC=15*60;
let EX=null;
function renderExamSetup(){
  const last=ST.exams.slice(-5).reverse();
  $("#tab-exam").innerHTML=`<div class="card">
   <h2 style="margin:0 0 6px;font-size:18px">Exam mode</h2>
   <p class="muted" style="margin:0 0 12px">${EXAM_N} random questions · ${EXAM_SEC/60}-minute timer · no hints, no feedback until you submit · full answer key at the end.</p>
   <div class="chips" id="exlv">${["easy","medium","hard","mixed"].map(l=>`<button class="chip${l==="mixed"?" on":""}" data-lv="${l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join("")}</div>
   <div class="actions"><button class="btn" id="exstart">Start exam</button></div>
   ${last.length?`<h4 style="margin:18px 0 4px">Recent exams</h4><div class="small">${last.map(e=>`<div>${esc(e.date)} · ${esc(e.level)} · <b>${e.score}/${e.n}</b> · ${Math.floor(e.secs/60)}m ${e.secs%60}s</div>`).join("")}</div>`:""}
  </div>`;
  let lv="mixed";
  $("#exlv").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{ lv=b.dataset.lv; $("#exlv").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); }));
  $("#exstart").addEventListener("click",()=>startExam(lv));
}
function startExam(level){
  const pool=shuffle(poolFor(level,"ALL")).slice(0,EXAM_N);
  EX={level,insts:pool.map(makeInst),answers:pool.map(()=>null),idx:0,start:Date.now(),left:EXAM_SEC};
  EX.timer=setInterval(()=>{ EX.left=EXAM_SEC-Math.floor((Date.now()-EX.start)/1000); updTimer(); if (EX.left<=0) submitExam(true); },1000);
  renderExamQ();
}
function updTimer(){ const t=$("#extimer"); if (!t||!EX) return; const s=Math.max(0,EX.left); t.textContent=`⏱ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; t.classList.toggle("low",s<=60); }
function renderExamQ(){
  const i=EX.idx, inst=EX.insts[i], el=$("#tab-exam");
  el.innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><b>Question ${i+1} of ${EX.insts.length}</b><span class="timer" id="extimer"></span></div>
    <div class="dots">${EX.insts.map((_,k)=>`<button class="dot${EX.answers[k]!=null&&EX.answers[k]!==""?" ans":""}${k===i?" cur":""}" data-k="${k}">${k+1}</button>`).join("")}</div>
  </div><div class="card" id="exq">${qHeader(inst.q)}${bodyHTML(inst,"exam",EX.answers[i])}
    <div class="actions"><button class="btn ghost" id="exprev"${i===0?" disabled":""}>← Previous</button>
    ${i<EX.insts.length-1?`<button class="btn" id="exnext">Next →</button>`:""}
    <button class="btn danger" id="exsubmit">Submit exam</button></div></div>`;
  updTimer();
  const q=$("#exq");
  wireBody(q,inst,{
    onPick:k=>{ EX.answers[i]=k; q.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i===k)); markDot(i); },
    onText:v=>{ EX.answers[i]=v; markDot(i); },
    onSubmit:()=>{ if (EX.idx<EX.insts.length-1){ EX.idx++; renderExamQ(); } }
  });
  el.querySelectorAll(".dot").forEach(b=>b.addEventListener("click",()=>{ EX.idx=+b.dataset.k; renderExamQ(); }));
  $("#exprev").addEventListener("click",()=>{ EX.idx--; renderExamQ(); });
  const n=$("#exnext"); if (n) n.addEventListener("click",()=>{ EX.idx++; renderExamQ(); });
  $("#exsubmit").addEventListener("click",()=>{
    const open=EX.answers.filter(a=>a==null||a==="").length;
    if (confirm(open?`${open} question(s) are unanswered. Submit anyway?`:"Submit the exam?")) submitExam(false);
  });
}
function markDot(i){ const d=document.querySelector(`.dot[data-k="${i}"]`); if (d) d.classList.toggle("ans",EX.answers[i]!=null&&EX.answers[i]!==""); }
function submitExam(timeUp){
  if (!EX) return; clearInterval(EX.timer);
  const secs=Math.min(EXAM_SEC,Math.floor((Date.now()-EX.start)/1000));
  let score=0;
  const items=EX.insts.map((inst,i)=>{
    const q=inst.q, a=EX.answers[i]; let ok=false, yours="<i>no answer</i>", note="";
    if (a!=null&&a!==""){
      if (inst.opts){ ok=inst.opts[a].ok; yours=q.t==="result"?tableHTML(inst.opts[a].rel):esc(inst.opts[a].text); }
      else if (q.t==="count"){ ok=+a===inst.expected; yours=esc(a); }
      else {
        const r=checkExpr(q.expr,a); ok=r.status==="ok"; yours=exprBlock(a);
        if (r.status==="syntax"||r.status==="error") note=`Evaluator: ${esc(r.msg)}`;
        else if (r.status==="wrong") note=esc(r.why);
        else if (r.status==="variant") note="Right on the sample data, but not on the hidden test data (see the boundaries / AND vs OR).";
      }
    }
    if (ok) score++;
    recordTopics(q,ok);
    let correct;
    if (inst.opts){ const c=inst.opts.find(o=>o.ok); correct=q.t==="result"?tableHTML(c.rel):esc(c.text); }
    else if (q.t==="count") correct=`<b>${inst.expected}</b>`;
    else correct=exprBlock(q.expr);
    return {inst,ok,yours,note,correct};
  });
  ST.exams.push({date:new Date().toLocaleString(),level:EX.level,score,n:EX.insts.length,secs}); ST.exams=ST.exams.slice(-20);
  save(); renderStats();
  const pct=Math.round(100*score/items.length);
  $("#tab-exam").innerHTML=`<div class="card">
    ${timeUp?`<div class="fb hint"><b class="t">Time is up — the exam was submitted automatically.</b></div>`:""}
    <div class="row" style="justify-content:space-between;margin-top:6px"><div><div class="big">${score} / ${items.length}</div><div class="muted">${pct}% · time used ${Math.floor(secs/60)}m ${secs%60}s · level: ${esc(EX.level)}</div></div>
    <button class="btn" id="exagain">New exam</button></div></div>
    <div class="card"><h3 style="margin:0 0 4px">Answer key</h3>
    ${items.map((it,i)=>`<div class="keyitem">
      <div class="row" style="justify-content:space-between"><b>Question ${i+1}</b><span class="pill ${it.ok?"ok":"bad"}">${it.ok?"✓ correct":"✗ wrong"}</span></div>
      ${qHeader(it.inst.q)}<div class="qtext" style="font-size:15px">${it.inst.q.q}</div>
      ${it.inst.q.t==="result"||it.inst.q.t==="count"?exprBlock(it.inst.q.expr):""}${it.inst.q.t==="error"?exprBlock(it.inst.q.bad):""}
      <div class="small muted" style="margin-top:6px">Your answer</div><div>${it.yours}</div>${it.note?`<div class="small" style="color:var(--bad)">${it.note}</div>`:""}
      <div class="small muted" style="margin-top:6px">Correct answer</div><div>${it.correct}</div>
      <details class="panel"><summary>Explanation</summary><div class="inner">${explainHTML(it.inst)}</div></details>
    </div>`).join("")}</div>`;
  $("#exagain").addEventListener("click",()=>{ EX=null; renderExamSetup(); });
  EX=null; window.scrollTo(0,0);
}

/* =====================================================================
   9. CHEAT SHEET, PROGRESS, DATABASE PANEL
   ===================================================================== */
const CHEAT=[
 ["SELECT","σ","sigma","unary","SELECT[condition](R)","Keeps the rows that satisfy the condition. Columns unchanged.","SELECT[age > 40](DRIVER)"],
 ["PROJECT","π","pi","unary","PROJECT[a, b](R)","Keeps only the listed columns; duplicate rows are removed.","PROJECT[make](BUS)"],
 ["RENAME","ρ","rho","unary","RENAME[S](R) · RENAME[S(a, b)](R) · RENAME[a -> b](R)","Renames the relation and/or its attributes. Needed for self-joins.","RENAME[R2(r, cost)](ROUTE)"],
 ["UNION","∪","union","binary","R UNION S","Tuples in R or S (or both). Needs union-compatible inputs.","PROJECT[driver_no](SELECT[route_no = 12](BUS_RIDE)) UNION PROJECT[driver_no](SELECT[route_no = 10](BUS_RIDE))"],
 ["INTERSECT","∩","intersection","binary","R INTERSECT S","Tuples in both R and S. Equals R − (R − S).","PROJECT[driver_no](SELECT[route_no = 12](BUS_RIDE)) INTERSECT PROJECT[driver_no](SELECT[route_no = 10](BUS_RIDE))"],
 ["MINUS","−","difference","binary","R MINUS S","Tuples in R that are not in S. Not commutative. Use it for 'never / not'.","PROJECT[driver_no](DRIVER) MINUS PROJECT[driver_no](BUS_RIDE)"],
 ["TIMES","×","cartesian product","binary","R TIMES S","Every tuple of R combined with every tuple of S: |R|·|S| rows, deg(R)+deg(S) columns.","PROJECT[make](SELECT[year > 2019](BUS)) TIMES PROJECT[city](BUS_STOP)"],
 ["JOIN","⋈θ","theta join","binary","R JOIN[condition] S","σ<sub>condition</sub>(R × S). Keeps both copies of the join columns.","BUS_RIDE JOIN[BUS_RIDE.route_no = ROUTE.route_no AND price > 2] ROUTE"],
 ["NJOIN","⋈","natural join","binary","R NJOIN S","Equi-join on ALL attributes with the same name; each appears once.","ROUTE NJOIN SELECT[stop_no = 1](ROUTE_STOP)"],
 ["DIVIDE","÷","division","binary","R DIVIDE S","Values of R's other attributes that are paired with EVERY tuple of S. For 'every / all' questions.","PROJECT[route_no, stop_no](ROUTE_STOP) DIVIDE PROJECT[stop_no](SELECT[city = 'Springfield'](BUS_STOP))"]
];
const SYNTAX_HELP=`<ul style="padding-left:18px;margin:4px 0">
 <li>Unary: <code>SELECT[cond](R)</code> σ · <code>PROJECT[a, b](R)</code> π · <code>RENAME[S](R)</code> ρ — also <code>RENAME[S(a, b)](R)</code> and <code>RENAME[old -> new](R)</code></li>
 <li>Binary: <code>R UNION S</code> ∪ · <code>R INTERSECT S</code> ∩ · <code>R MINUS S</code> − · <code>R TIMES S</code> × · <code>R JOIN[cond] S</code> ⋈<sub>θ</sub> · <code>R NJOIN S</code> ⋈ · <code>R DIVIDE S</code> ÷</li>
 <li>Conditions: <code>= &lt;&gt; != &lt; &gt; &lt;= &gt;=</code>, combined with <code>AND</code> <code>OR</code> <code>NOT</code> and parentheses.</li>
 <li>Text, dates and times go in quotes: <code>make = 'Volvo'</code>, <code>date = '2026-11-20'</code>. Numbers don't: <code>salary &gt; 50000</code>.</li>
 <li>If two columns have the same name, qualify them: <code>BUS_RIDE.driver_no = DRIVER.driver_no</code>.</li>
 <li>Upper/lower case and spaces don't matter. You may also type the real symbols (σ π ρ ∪ ∩ − × ⋈ ÷).</li>
 <li>Precedence: TIMES / JOIN / NJOIN / DIVIDE bind tighter than UNION / INTERSECT / MINUS (like × before +). Operators of the same level go left to right. When in doubt, use parentheses.</li>
 <li>Typed answers are checked by <b>running</b> your expression on the sample data (and on hidden test data), so any equivalent correct expression is accepted.</li></ul>`;
function renderCheat(){
  $("#tab-cheat").innerHTML=`<div class="card"><h2 style="margin:0 0 4px;font-size:18px">Cheat sheet — all operators</h2>
   <p class="muted small" style="margin:0 0 10px">Each example runs on the sample database. Tap "result" to see the output.</p>
   <div class="cheat">${CHEAT.map(c=>`<div class="op"><span class="sym">${c[1]}</span><h3>${c[0]} <span class="muted" style="font-weight:400">· ${c[2]}</span></h3>
     <div class="ar">${c[3]}</div><p><code>${esc(c[4])}</code></p><p>${c[5]}</p>${exprBlock(c[6])}
     <details><summary class="small" style="cursor:pointer">result</summary>${tableHTML(runSrc(c[6]).rel,10)}</details></div>`).join("")}</div>
   <h3 style="margin:16px 0 4px;font-size:15px">Handy patterns</h3>
   <ul class="small" style="padding-left:18px;margin:0">
    <li><b>“… who never …”</b> → all IDs <code>MINUS</code> the IDs that appear.</li>
    <li><b>“… every / all …”</b> → <code>DIVIDE</code>: dividend (result attrs + matching attrs), divisor (only the matching attrs).</li>
    <li><b>“both A and B”</b> over different rows → two queries combined with <code>INTERSECT</code>, not <code>AND</code>.</li>
    <li><b>Maximum</b> → all <code>MINUS</code> those for which someone is bigger (self-join with <code>RENAME</code>).</li>
    <li><b>Order of operators</b>: SELECT early, PROJECT last (don't project away an attribute you still need).</li>
   </ul></div>
   <div class="card"><h2 style="margin:0 0 4px;font-size:18px">Playground</h2>
    <p class="muted small" style="margin:0 0 8px">Type any expression and run it on the sample database.</p>
    <textarea id="pg" rows="3" spellcheck="false" autocapitalize="off">PROJECT[first_name, last_name](SELECT[salary > 50000](DRIVER))</textarea>
    <div class="actions"><button class="btn" id="pgrun">Run</button></div><div id="pgout"></div></div>`;
  const run=()=>{ const out=$("#pgout"); try { out.innerHTML=`<div class="explain">${walk($("#pg").value)}</div><h4 class="muted">Final result</h4>${tableHTML(runSrc($("#pg").value).rel,50)}`; } catch(e){ out.innerHTML=fb("bad","Error",`<div>${esc(e.message)}</div>${e.where?`<div class="small">In: <code>${esc(plain(e.where))}</code></div>`:""}`); } };
  $("#pgrun").addEventListener("click",run);
  $("#pg").addEventListener("keydown",e=>{ if (e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); run(); } });
}
function renderProgress(){
  const rows=Object.keys(TOPIC_LABEL).map(t=>{ const o=ST.topics[t]||{a:0,m:0}; return {t,a:o.a,m:o.m,rate:o.a?o.m/o.a:0}; })
    .sort((x,y)=>(y.a?1:0)-(x.a?1:0)||y.rate-x.rate||y.m-x.m);
  const acc=ST.answered?Math.round(100*ST.first/ST.answered):0;
  $("#tab-progress").innerHTML=`<div class="card"><h2 style="margin:0 0 8px;font-size:18px">Your progress</h2>
    <div class="row small"><span class="stat">Score <b>${+ST.points.toFixed(1)}</b></span><span class="stat">Answered <b>${ST.answered}</b></span><span class="stat">First-try correct <b>${acc}%</b></span><span class="stat">Best streak <b>${ST.best}</b></span><span class="stat">Exams <b>${ST.exams.length}</b></span></div>
    <h3 style="margin:16px 0 2px;font-size:15px">Weak topics</h3><p class="small muted" style="margin:0 0 6px">Miss rate per operator (a question counts as missed if it wasn't right on the first try). Worst first.</p>
    ${rows.map(r=>`<div class="topicrow"><span class="nm">${esc(TOPIC_LABEL[r.t])}</span><span class="bar"><i style="width:${Math.round(r.rate*100)}%"></i></span>
      <span class="pc">${r.a?`${Math.round(r.rate*100)}% missed (${r.m}/${r.a})`:"not tried yet"}</span>
      <button class="chip" data-train="${r.t}">Practice</button></div>`).join("")}
    <div class="actions"><button class="btn ghost" id="reset">Reset all progress</button></div></div>`;
  document.querySelectorAll("[data-train]").forEach(b=>b.addEventListener("click",()=>{ P.topic=b.dataset.train; P.level="mixed"; P.queue=[]; show("practice"); renderPracticeShell(); nextQ(); }));
  $("#reset").addEventListener("click",()=>{ if (confirm("Reset score, streak, weak topics and exam history?")){ ST=freshStats(); save(); renderStats(); renderProgress(); } });
}
function renderDB(){
  $("#dbinner").innerHTML=`<div class="dbgrid">${Object.entries(TABLES).map(([n,t])=>`<div><div class="tname">${n}<span>(${t.cols.join(", ")})</span></div>${tableHTML({cols:t.cols.map(c=>({n:c,q:[n]})),rows:t.rows},20)}</div>`).join("")}</div>`;
  $("#syntaxhelp").innerHTML=SYNTAX_HELP;
}
function show(tab){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  for (const t of ["practice","exam","cheat","progress"]) $("#tab-"+t).classList.toggle("hidden",t!==tab);
  if (tab==="progress") renderProgress();
  if (tab==="exam"&&!EX) renderExamSetup();
}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));

renderStats(); renderDB(); renderCheat(); renderPracticeShell(); nextQ();
</script>
