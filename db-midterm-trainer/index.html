<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAI 105 ERD Trainer</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1c2333; --muted:#5d6678; --line:#dce1ea; --soft:#eef1f7;
  --accent:#3651d4; --accent-soft:#e8ecff; --accent-ink:#ffffff;
  --ok:#237a3b; --okbg:#e9f8ee; --err:#c02b2b; --errbg:#fdeeee; --warn:#9a5b00; --warnbg:#fff6dc;
  --ent:#e6efff; --rel:#ffefdc; --att:#eaf7ee; --stroke:#2b3447; --diag:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --card:#1b1f29; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2e3443; --soft:#232836;
    --accent:#8197ff; --accent-soft:#252c4a; --accent-ink:#0d1020;
    --ok:#6fd08a; --okbg:#18301f; --err:#ff8a8a; --errbg:#3a1d1f; --warn:#f3c463; --warnbg:#3a3018;
    --ent:#22304d; --rel:#45331d; --att:#1e3a29; --stroke:#c9d1e3; --diag:#1b1f29;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --card:#1b1f29; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2e3443; --soft:#232836;
  --accent:#8197ff; --accent-soft:#252c4a; --accent-ink:#0d1020;
  --ok:#6fd08a; --okbg:#18301f; --err:#ff8a8a; --errbg:#3a1d1f; --warn:#f3c463; --warnbg:#3a3018;
  --ent:#22304d; --rel:#45331d; --att:#1e3a29; --stroke:#c9d1e3; --diag:#1b1f29;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topin{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#timerBadge{display:none;font-variant-numeric:tabular-nums;background:var(--errbg);color:var(--err);padding:4px 10px;border-radius:999px;font-weight:700;text-decoration:none;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.5rem;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:1.2em 0 .5em}
h3{font-size:1.05rem;margin:.8em 0 .4em}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--err)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.actions.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);z-index:5}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);background:var(--card);font-size:14px}
.tabs a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--muted);margin-right:4px}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.err{background:var(--errbg);color:var(--err)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.story{border-left:4px solid var(--accent)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.twist{background:var(--warnbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
input.in,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
textarea.prose{font-family:inherit;min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input.in{flex:1 1 160px}
.icon{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}
.icon:hover{background:var(--errbg);color:var(--err)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12.5px;cursor:pointer;user-select:none;background:var(--card)}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip input{margin:0;accent-color:var(--accent)}
.ent.card{border-left:4px solid var(--line)}
.attrs{margin:8px 0 6px 6px;border-left:2px dashed var(--line);padding-left:10px}
.attr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:8px;margin:2px 0}
.attr > input.in{flex:1 1 140px}
.attr .flags{display:flex;gap:4px;flex-wrap:wrap}
.attr input.parts{flex:1 1 100%}
.relgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:8px 0}
.relgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.relgrid select{width:100%}
.readas{background:var(--soft);border-radius:8px;padding:6px 10px;margin:6px 0}
.bad{background:var(--errbg)!important;border-color:var(--err)!important}
.ent.card.bad,.rel.card.bad{border-left-color:var(--err)!important}
.good{border-left-color:var(--ok)!important}
.attr.good{background:var(--okbg)}
.fb .item{display:flex;gap:10px;padding:8px 10px;border-radius:8px;margin:4px 0;align-items:flex-start}
.fb .item.err{background:var(--errbg)} .fb .item.warn{background:var(--warnbg)} .fb .item.ok{background:var(--okbg)}
.fb .ic{font-weight:700;width:18px;flex:none;text-align:center}
.fb .err .ic{color:var(--err)} .fb .warn .ic{color:var(--warn)} .fb .ok .ic{color:var(--ok)}
.fb .hint{font-size:13px;color:var(--muted);margin-top:2px}
.fb .ans{font-size:13px;margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.scorebar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0}
.scorebar > div{height:100%;background:var(--accent)}
.score{font-size:1.6rem;font-weight:700}
.dtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.dwrap{background:var(--diag);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:78vh;touch-action:none}
svg.erd{display:block;touch-action:none;user-select:none}
svg.erd .sh{stroke:var(--stroke);stroke-width:1.5}
svg.erd .ent{fill:var(--ent)} svg.erd .rel{fill:var(--rel)} svg.erd .att{fill:var(--att)}
svg.erd .in{fill:none}
svg.erd .dash{stroke-dasharray:5 3}
svg.erd .tx{fill:var(--ink);font-size:13px;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
svg.erd .tx.b{font-weight:600}
svg.erd .ul{stroke:var(--ink);stroke-width:1.2}
svg.erd .ul.d{stroke-dasharray:3 2}
svg.erd .ln{stroke:var(--stroke);stroke-width:1.4}
svg.erd .ln2{stroke:var(--stroke);stroke-width:5}
svg.erd .gap{stroke:var(--diag);stroke-width:1.8}
svg.erd .card{fill:var(--accent);font-weight:700;font-size:13px;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
svg.erd .nd{cursor:grab}
svg.erd .empty{fill:var(--muted);font-size:14px;text-anchor:middle}
pre.schema{background:var(--soft);border-radius:10px;padding:12px;overflow:auto;font-size:13.5px;white-space:pre-wrap;margin:6px 0}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.unitcard h3{margin-top:0}
.prog{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dot{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.dot.done{background:var(--okbg);color:var(--ok)}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sym{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);break-inside:avoid}
.sym svg{width:100%;height:70px}
.cover li.ok{color:var(--ok)} .cover li.miss{color:var(--err)}
ol.steps li{margin:4px 0}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:6px 0}
.wbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0}
.wbar > div{height:100%;background:var(--err)}
.timerbig{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  main{padding:12px 12px 80px}
  .relgrid{grid-template-columns:1fr 1fr}
  .relgrid .cardsel{grid-column:1 / -1;order:-1}
  .relgrid .spacer{display:none}
  nav a{padding:5px 7px;font-size:13px}
}
@media print{
  header.top,.noprint,.actions{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .card{border:1px solid #bbb;break-inside:avoid}
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#444;--line:#bbb;--soft:#f1f1f1;--ent:#fff;--rel:#fff;--att:#fff;--stroke:#000;--diag:#fff}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <a class="brand" href="#/">CAI 105 <span>ERD Trainer</span></a>
    <a id="timerBadge" href="#/exam"></a>
    <nav>
      <a href="#/" data-nav="home">Learn</a>
      <a href="#/exam" data-nav="exam">Exam</a>
      <a href="#/weak" data-nav="weak">Weak spots</a>
      <a href="#/sheet" data-nav="sheet">Review sheet</a>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   SCENARIO DATA
   ---------------------------------------------------------------------
   Add your own scenarios by copying one of these objects.
   Entity:      { name, weak?, owner?, aka?:[other accepted names], attrs:[...] }
   Attribute:   'Name'  (plain)  or  { name, key?, partial?, multi?, derived?,
                parts?:['First','Last'] (composite), aka?:[...] }
   Relationship:{ name, a, b, card:'1:1'|'1:N'|'N:1'|'M:N' (read "a : b"),
                partA/partB:'total'|'partial', identifying?, attrs?:[...],
                keyAttr? (M:N attribute that must be part of the PK when the same
                pair can repeat), keyAttrRequired?, fkIn?:'a'|'b' (1:1 default
                side when both sides have the same participation),
                fkName? (nicer FK column name), flex?:['a','b'] (participation
                is debatable -> not graded), aka?:[...] }
   The relational schema (model answer for Type 2) and the mapping
   explanation are generated automatically from the ERD using the
   course mapping rules, so you only write the ERD.
   ===================================================================== */
const SCENARIOS = [
/* ---------------- Unit 1: entities, keys, 1:N ---------------- */
{ id:'company', unit:1, role:'worked', level:1, title:'Company departments',
  story:'A small company keeps track of its departments and employees. Each department has a department ID and a name. Each employee has an employee ID, a name and a salary. Every employee works in exactly one department. A department can have many employees, but a newly created department may have no employees yet.',
  entities:[
    {name:'DEPARTMENT', aka:['DEPT'], attrs:[{name:'DeptID',key:true},'DeptName']},
    {name:'EMPLOYEE', aka:['EMP'], attrs:[{name:'EmpID',key:true},'EmpName','Salary']}
  ],
  rels:[{name:'WORKS_IN', aka:['WORKS_FOR','BELONGS_TO','EMPLOYS'], a:'EMPLOYEE', b:'DEPARTMENT', card:'N:1', partA:'total', partB:'partial'}],
  steps:[
    'Entities = nouns that have their own data: DEPARTMENT and EMPLOYEE.',
    'Attributes: DEPARTMENT(DeptID, DeptName), EMPLOYEE(EmpID, EmpName, Salary). The IDs are the keys (underlined).',
    'Relationship = the verb "works in". Ask twice: one employee works in how many departments? ONE. One department has how many employees? MANY. So EMPLOYEE N:1 DEPARTMENT.',
    'Participation: "every employee works in exactly one" -> EMPLOYEE total (double line). "may have no employees yet" -> DEPARTMENT partial (single line).',
    'Mapping: each entity becomes a table. 1:N -> the PK of the 1 side (DeptID) goes as FK into the N side (EMPLOYEE).'
  ],
  assumptions:['Department IDs and employee IDs are unique.','An employee belongs to only one department at a time.']
},
{ id:'league', unit:1, role:'similar', level:1, title:'Sports league',
  twist:'Same pattern as the worked example: two entities and one 1:N relationship.',
  story:'A sports league stores teams and players. A team has a team ID, a team name and a home city. A player has a player ID, a name and a position. Each player plays for exactly one team, and a team has many players. Every team in the league must have at least one player.',
  entities:[
    {name:'TEAM', attrs:[{name:'TeamID',key:true},'TeamName',{name:'City',aka:['HomeCity']}]},
    {name:'PLAYER', attrs:[{name:'PlayerID',key:true},'PlayerName','Position']}
  ],
  rels:[{name:'PLAYS_FOR', aka:['PLAYS_IN','HAS','BELONGS_TO'], a:'PLAYER', b:'TEAM', card:'N:1', partA:'total', partB:'total'}],
  assumptions:['A player plays for one team at a time.']
},
{ id:'carrental', unit:1, role:'twist', level:2, title:'Car rental branches',
  twist:'Twist: the 1:N relationship has its own attribute (BasedSince). In the schema it travels with the FK to the N side.',
  story:'A car rental company has branches and cars. Each branch has a branch ID, a city and a phone number. Each car has a plate number, a model and a year. Every car is based at exactly one branch, and the company records since when the car has been based there (based-since date). A branch may have many cars, but a new branch may have none.',
  entities:[
    {name:'BRANCH', attrs:[{name:'BranchID',key:true},'City','Phone']},
    {name:'CAR', attrs:[{name:'PlateNo',key:true,aka:['Plate','LicensePlate','PlateNumber']},'Model','Year']}
  ],
  rels:[{name:'BASED_AT', aka:['BELONGS_TO','HAS','LOCATED_AT'], a:'CAR', b:'BRANCH', card:'N:1', partA:'total', partB:'partial', attrs:[{name:'BasedSince',aka:['Since','SinceDate']}]}],
  assumptions:['A car is based at one branch at a time, so BasedSince is stored in CAR next to the FK BranchID.']
},
/* ---------------- Unit 2: composite (+ derived) ---------------- */
{ id:'gym', unit:2, role:'worked', level:2, title:'Gym members and trainers',
  story:'A gym stores its members and personal trainers. A member has a member ID, a name (first name and last name), an address (street, city, ZIP) and a join date. A trainer has a trainer ID and a name (first name and last name). A member may have one personal trainer; a trainer can train many members, and some trainers have no members yet.',
  entities:[
    {name:'MEMBER', attrs:[{name:'MemberID',key:true},{name:'Name',parts:['FirstName','LastName']},{name:'Address',parts:['Street','City','ZIP']},'JoinDate']},
    {name:'TRAINER', attrs:[{name:'TrainerID',key:true},{name:'Name',parts:['FirstName','LastName']}]}
  ],
  rels:[{name:'TRAINED_BY', aka:['TRAINS','HAS_TRAINER'], a:'MEMBER', b:'TRAINER', card:'N:1', partA:'partial', partB:'partial'}],
  steps:[
    'Entities: MEMBER and TRAINER.',
    '"a name (first name and last name)" -> Name is COMPOSITE with parts FirstName, LastName. "an address (street, city, ZIP)" -> Address is composite with parts Street, City, ZIP. In Chen the parts are small ovals hanging off the Name/Address oval.',
    'TRAINED_BY: one member has at most ONE trainer, one trainer has MANY members -> MEMBER N:1 TRAINER. Both sides partial ("may", "some trainers have no members").',
    'Mapping: a composite is NOT a column. Only its simple parts are stored: MEMBER(MemberID, FirstName, LastName, Street, City, ZIP, JoinDate, TrainerID FK).',
    'TrainerID can be NULL in MEMBER because participation of MEMBER is partial.'
  ],
  assumptions:['A member has at most one personal trainer at a time.']
},
{ id:'petclinic', unit:2, role:'similar', level:2, title:'Pet clinic',
  twist:'Same idea: split the composite Name and Address into their parts.',
  story:'A pet clinic stores owners and their pets. An owner has an owner ID, a name (first and last), an address (street, city, ZIP) and a phone number. A pet has a pet ID, a pet name and a species. Every pet belongs to exactly one owner, and an owner can have several pets. Only people who have at least one pet are stored as owners.',
  entities:[
    {name:'OWNER', attrs:[{name:'OwnerID',key:true},{name:'Name',parts:['FirstName','LastName']},{name:'Address',parts:['Street','City','ZIP']},'Phone']},
    {name:'PET', attrs:[{name:'PetID',key:true},'PetName','Species']}
  ],
  rels:[{name:'OWNS', aka:['HAS','BELONGS_TO'], a:'OWNER', b:'PET', card:'1:N', partA:'total', partB:'total'}],
  assumptions:['An owner has only one phone number (the story says "a phone number").']
},
{ id:'courses', unit:2, role:'twist', level:3, title:'Online course platform',
  twist:'Twist: a DERIVED attribute (YearsOfService). Draw it as a dashed oval and do NOT store it as a column.',
  story:'An online learning platform stores instructors and courses. An instructor has an instructor ID, a name (first and last), a hire date and years of service (calculated from the hire date). A course has a course code, a title and a number of credits. Each course is taught by exactly one instructor; an instructor can teach many courses, and new instructors may not teach any course yet.',
  entities:[
    {name:'INSTRUCTOR', attrs:[{name:'InstructorID',key:true},{name:'Name',parts:['FirstName','LastName']},'HireDate',{name:'YearsOfService',derived:true,aka:['Years','ServiceYears']}]},
    {name:'COURSE', attrs:[{name:'CourseCode',key:true},'Title','Credits']}
  ],
  rels:[{name:'TEACHES', aka:['TAUGHT_BY'], a:'INSTRUCTOR', b:'COURSE', card:'1:N', partA:'partial', partB:'total'}],
  assumptions:['YearsOfService is computed from HireDate and today\'s date, so it is not stored.']
},
/* ---------------- Unit 3: multivalued ---------------- */
{ id:'restaurant', unit:3, role:'worked', level:3, title:'Restaurant chain',
  story:'A restaurant chain stores restaurants and chefs. A restaurant has a restaurant ID, a name, an address (street, city, ZIP) and several phone numbers. A chef has a chef ID, a name (first and last) and a hire date. Every chef works at exactly one restaurant; a restaurant employs many chefs and must have at least one.',
  entities:[
    {name:'RESTAURANT', aka:['REST'], attrs:[{name:'RestaurantID',key:true,aka:['RestID']},'RestaurantName',{name:'Address',parts:['Street','City','ZIP']},{name:'Phone',multi:true}]},
    {name:'CHEF', attrs:[{name:'ChefID',key:true},{name:'Name',parts:['FirstName','LastName']},'HireDate']}
  ],
  rels:[{name:'WORKS_AT', aka:['WORKS_IN','EMPLOYS'], a:'CHEF', b:'RESTAURANT', card:'N:1', partA:'total', partB:'total'}],
  steps:[
    '"several phone numbers" -> Phone is MULTIVALUED: one restaurant has many values of the same attribute. Chen: double oval.',
    'Address is composite (street, city, ZIP); chef Name is composite.',
    'WORKS_AT: CHEF N:1 RESTAURANT, both total ("every chef", "must have at least one").',
    'Mapping: a table cell holds ONE value, so Phone cannot stay in RESTAURANT. New table RESTAURANT_PHONE(RestaurantID FK, Phone) with PK = (RestaurantID, Phone) - both columns, so a restaurant can have many phones but not the same phone twice.',
    'CHEF gets RestaurantID as FK (1:N rule).'
  ],
  assumptions:['Two restaurants may share a phone number (that is why the owner key is part of the PK).']
},
{ id:'agents', unit:3, role:'similar', level:3, title:'Literary agents',
  twist:'Same idea: multivalued attributes on both entities.',
  story:'A publishing agency stores authors and agents. An author has an author ID, a name (first and last) and one or more email addresses. An agent has an agent ID, an agent name and several phone numbers. An agent represents many authors; each author is represented by at most one agent. Every agent represents at least one author.',
  entities:[
    {name:'AUTHOR', attrs:[{name:'AuthorID',key:true},{name:'Name',parts:['FirstName','LastName']},{name:'Email',multi:true}]},
    {name:'AGENT', attrs:[{name:'AgentID',key:true},'AgentName',{name:'Phone',multi:true}]}
  ],
  rels:[{name:'REPRESENTS', aka:['REPRESENTED_BY','HAS_AGENT'], a:'AGENT', b:'AUTHOR', card:'1:N', partA:'total', partB:'partial'}]
},
{ id:'apartments', unit:3, role:'twist', level:4, title:'Apartment rentals',
  twist:'Twist: composite + multivalued + derived together, and the multivalued attribute is a "list of features", not a phone number.',
  story:'A rental agency stores landlords and apartments. A landlord has a landlord ID, a name (first and last) and several phone numbers. An apartment has an apartment ID, an address (street, city, ZIP), a size in square meters, a monthly rent, a rent per square meter (computed from rent and size) and a list of features (for example balcony, parking, elevator). Each apartment is owned by exactly one landlord; a landlord owns one or more apartments.',
  entities:[
    {name:'LANDLORD', attrs:[{name:'LandlordID',key:true},{name:'Name',parts:['FirstName','LastName']},{name:'Phone',multi:true}]},
    {name:'APARTMENT', aka:['APT','FLAT'], attrs:[{name:'ApartmentID',key:true,aka:['AptID']},{name:'Address',parts:['Street','City','ZIP']},'Size',{name:'Rent',aka:['MonthlyRent']},{name:'RentPerSqm',derived:true,aka:['PricePerSqm','RentPerM2','RentPerSquareMeter','RentPerSqMeter']},{name:'Feature',multi:true}]}
  ],
  rels:[{name:'OWNS', aka:['OWNED_BY','HAS'], a:'LANDLORD', b:'APARTMENT', card:'1:N', partA:'total', partB:'total'}]
},
/* ---------------- Unit 4: weak entities ---------------- */
{ id:'dependents', unit:4, role:'worked', level:4, title:'Employees and dependents',
  story:'A company stores employees and their dependents (children, spouses) for insurance. An employee has an employee ID, a name (first and last) and a salary. A dependent has a name, a birth date and a relationship to the employee (e.g. son, spouse). Dependents do not have their own ID: two different employees could each have a dependent called "Sara", so a dependent can only be identified by the employee it belongs to together with the dependent name. An employee may have zero or more dependents.',
  entities:[
    {name:'EMPLOYEE', aka:['EMP'], attrs:[{name:'EmpID',key:true},{name:'Name',parts:['FirstName','LastName']},'Salary']},
    {name:'DEPENDENT', weak:true, owner:'EMPLOYEE', attrs:[{name:'DependentName',partial:true,aka:['DepName']},{name:'BirthDate',aka:['DOB']},'Relationship']}
  ],
  rels:[{name:'HAS_DEPENDENT', aka:['HAS','DEPENDS_ON','DEPENDENTS_OF'], a:'EMPLOYEE', b:'DEPENDENT', card:'1:N', partA:'partial', partB:'total', identifying:true}],
  steps:[
    '"Dependents do not have their own ID ... identified by the employee together with the dependent name" -> DEPENDENT is a WEAK entity (double rectangle). Owner = EMPLOYEE.',
    'DependentName is the PARTIAL key (dashed underline): unique only inside one employee.',
    'HAS_DEPENDENT is the IDENTIFYING relationship (double diamond), 1:N. The weak side is always total (a dependent cannot exist without its employee).',
    'Mapping: DEPENDENT(EmpID PK FK->EMPLOYEE, DependentName PK, BirthDate, Relationship). PK = owner key + partial key. ON DELETE CASCADE: deleting the employee deletes their dependents.',
    'The identifying relationship does NOT get its own table - the owner key inside DEPENDENT already represents it.'
  ],
  assumptions:['An employee never has two dependents with the same name.']

{ id:'enrollment', unit:5, role:'worked', level:5, title:'Students and courses',
  story:'A college stores students and courses. A student has a student ID, a name and a major. A course has a course code, a title and credits. A student can enroll in many courses and a course has many students. For every enrollment the college records the grade the student received. Students may be enrolled in no course yet, and new courses may have no students.',
  entities:[
    {name:'STUDENT', attrs:[{name:'StudentID',key:true},'StudentName','Major']},
    {name:'COURSE', attrs:[{name:'CourseCode',key:true},'Title','Credits']}
  ],
  rels:[{name:'ENROLLS', aka:['ENROLLED_IN','TAKES','ENROLLMENT','ENROLL'], a:'STUDENT', b:'COURSE', card:'M:N', partA:'partial', partB:'partial', attrs:['Grade']}],
  steps:[
    'One student - many courses, one course - many students -> M:N.',
    'Grade does not describe a student alone (a student has many grades) nor a course alone. It describes ONE student in ONE course -> it is an attribute of the relationship ENROLLS (oval on the diamond).',
    'Mapping: M:N always becomes a NEW table: ENROLLS(StudentID PK FK->STUDENT, CourseCode PK FK->COURSE, Grade).',
    'PK = both FKs together. If a student could repeat the same course, we would add e.g. Semester to the key - state that as an assumption.'

{ id:'managers', unit:6, role:'worked', level:6, title:'Department managers',
  story:'A company stores departments and employees. A department has a department ID and a name. An employee has an employee ID, a name (first and last) and a salary. Every employee works in exactly one department, and a department has many employees. In addition, every department is managed by exactly one employee, and the company records the date that employee started managing it. An employee manages at most one department (most employees manage none).',
  entities:[
    {name:'DEPARTMENT', aka:['DEPT'], attrs:[{name:'DeptID',key:true},'DeptName']},
    {name:'EMPLOYEE', aka:['EMP'], attrs:[{name:'EmpID',key:true},{name:'Name',parts:['FirstName','LastName']},'Salary']}
  ],
  rels:[
    {name:'WORKS_IN', aka:['WORKS_FOR','EMPLOYS'], a:'EMPLOYEE', b:'DEPARTMENT', card:'N:1', partA:'total', partB:'total', flex:['b']},
    {name:'MANAGES', aka:['MANAGED_BY','HEADS'], a:'EMPLOYEE', b:'DEPARTMENT', card:'1:1', partA:'partial', partB:'total', attrs:[{name:'StartDate',aka:['MgrStartDate','ManagerSince','Since']}], fkName:'ManagerID'}
  ],
  steps:[
    'There are TWO relationships between the same two entities: WORKS_IN (N:1) and MANAGES (1:1). Draw two diamonds.',
    'MANAGES: one department has exactly one manager, one employee manages at most one department -> 1:1.',
    'Participation of MANAGES: DEPARTMENT total ("every department is managed"), EMPLOYEE partial ("most manage none").',
    'StartDate belongs to the management relationship -> oval on the MANAGES diamond.',
    'Mapping 1:1: put the FK on the TOTAL side -> DEPARTMENT gets ManagerID FK->EMPLOYEE, UNIQUE, plus StartDate. Every department has a value, so no NULLs. UNIQUE makes sure one employee manages at most one department (otherwise it would be 1:N).',
    'If we put it in EMPLOYEE instead, almost every employee row would have NULL - that is the trap.'
  ],
  assumptions:['ManagerID is the EmpID of the manager (renamed so it is not confused with the WORKS_IN FK).']
},

{ id:'library', unit:7, role:'exam', level:8, title:'City library',

const UNITS = [
 {n:1, title:'Entities, keys & 1:N relationships', worked:'company', ex:['league','carrental'],
  learn:`<p><b>Entity</b> = a "thing" the business stores data about and that has its own identity - usually a noun in the story (member, book, doctor). Chen symbol: <b>rectangle</b>.</p>
  <p><b>Attribute</b> = a property of an entity (name, salary). Symbol: <b>oval</b>. The <b>key attribute</b> uniquely identifies each entity (ID, ISBN, plate number) - its name is <u>underlined</u>.</p>
  <p><b>Relationship</b> = how entities are connected - usually a verb (works in, borrows). Symbol: <b>diamond</b>.</p>
  <p><b>Cardinality ratio</b> - ask two questions: "one A is linked to how many B?" and "one B is linked to how many A?". One + many = <b>1:N</b>.</p>
  <p><b>Participation</b>: <b>total</b> (double line) when <i>every</i> entity must take part - words like "every", "must", "exactly one", "at least one". <b>Partial</b> (single line) when some may not - "may", "can", "some", "at most one".</p>
  <div class="callout"><b>Mapping rule:</b> every strong entity becomes a table, its key becomes the PK. <b>1:N</b> -> copy the PK of the <b>1 side</b> as a FK into the table of the <b>N side</b> (relationship attributes go there too). Memory trick: <i>the many side remembers its one</i>.</div>`},
 {n:2, title:'Composite (and derived) attributes', worked:'gym', ex:['petclinic','courses'],
  learn:`<p>A <b>composite attribute</b> is made of smaller parts: Name = FirstName + LastName, Address = Street + City + ZIP. Story signal: "a name (first and last)", "an address (street, city, ZIP)". Chen: an oval with its parts as ovals hanging off it.</p>
  <p>A <b>derived attribute</b> can be calculated from other data: Age from DOB, YearsOfService from HireDate, a total from order lines. Story signal: "calculated", "computed", "based on". Chen: <b>dashed oval</b>.</p>
  <div class="callout"><b>Mapping rule:</b> composite -> store only its <b>simple parts</b> as columns (no "Name" column). Derived -> <b>not stored</b> at all (compute it in a query).</div>`},
 {n:3, title:'Multivalued attributes', worked:'restaurant', ex:['agents','apartments'],
  learn:`<p>A <b>multivalued attribute</b> can hold several values for one entity: phone numbers, emails, keywords, specialties, features. Story signal: "several", "one or more", "a set of", "a list of", plural nouns. Chen: <b>double oval</b>.</p>
  <p>Why a new table? A table cell can hold only ONE value (first normal form). Putting "Phone1, Phone2, Phone3" columns is wrong too.</p>
  <div class="callout"><b>Mapping rule:</b> new table <code>OWNER_ATTR(OwnerKey FK->OWNER, Value)</code>, <b>PK = both columns</b>. Example: <code>DOCTOR_PHONE(DoctorID PK FK->DOCTOR, Phone PK)</code>.</div>
  <p class="small muted">Trap: PK = only OwnerKey would allow just one phone per owner - the whole point is lost.</p>`},
 {n:4, title:'Weak entities', worked:'dependents', ex:['hotelrooms','sections'],
  learn:`<p>A <b>weak entity</b> has no key of its own. It can only be identified <b>together with its owner</b> (identifying relationship) plus its <b>partial key</b>. Story signals: "identified by ... together with ...", "numbered within each ...", "has no ID of its own", "copy 1, copy 2 of each book".</p>
  <p>Chen: weak entity = <b>double rectangle</b>; identifying relationship = <b>double diamond</b>; partial key = <b>dashed underline</b>; the weak entity always has <b>total</b> participation (double line).</p>
  <div class="callout"><b>Mapping rule:</b> table with the <b>owner's PK as FK</b> + the partial key. <b>PK = owner key + partial key</b>. Add <b>ON DELETE CASCADE</b> (no owner -> no weak rows). The identifying relationship gets no table of its own.</div>`},
 {n:5, title:'M:N relationships with attributes', worked:'enrollment', ex:['projects','videorental'],
  learn:`<p><b>M:N</b>: one A has many B <i>and</i> one B has many A (students-courses, authors-books, doctors-patients).</p>
  <p>A <b>relationship attribute</b> describes one specific <i>pair</i>, not either entity alone: Grade (this student in this course), Hours, LoanDate. In Chen it is an oval attached to the diamond.</p>
  <div class="callout"><b>Mapping rule:</b> new table named after the relationship with <b>both PKs as FKs</b>; <b>PK = both keys</b>; the relationship attributes go in this table. If the <b>same pair can repeat</b> (same member borrows the same copy again), add the date to the PK and say so in your assumptions.</div>`},
 {n:6, title:'1:1 relationships & total participation', worked:'managers', ex:['parking','principals'],
  learn:`<p><b>1:1</b>: one A has at most one B and one B has at most one A (department-manager, member-card).</p>
  <p>Participation matters most here. If every department must have a manager, DEPARTMENT is <b>total</b>; if most employees are not managers, EMPLOYEE is <b>partial</b>.</p>
  <div class="callout"><b>Mapping rule:</b> put the FK on the side with <b>total participation</b> (every row has a value -> no NULLs) and mark it <b>UNIQUE</b> (without UNIQUE it would be 1:N). Relationship attributes go with the FK. If both sides are total (or both partial), either side works - state your choice as an assumption.</div>`},
 {n:7, title:'Exam-style scenarios', worked:null, ex:['library','hospital','bus','shop'],
  learn:`<p>Now everything together, exactly like the midterm. Work in this order:</p>
  <ol class="steps"><li>Underline every noun with its own data -> entities. Is any of them "identified by X together with Y"? -> weak entity.</li>
  <li>For each entity list attributes; mark key, composite (parts in brackets), multivalued ("several / set of"), derived ("calculated").</li>
  <li>Find every verb between entities -> relationships. For each: cardinality (ask both directions), participation of each side ("every / exactly one" = total), and attributes that belong to the pair (dates!).</li>
  <li>Draw the ERD. Then map: entities -> multivalued -> weak -> 1:1 -> 1:N -> M:N.</li>
  <li>Write assumptions: M:N keys (can the pair repeat?), 1:1 FK side, NULL-able FKs.</li></ol>`}
];

/* ---- name normalisation: ignore case, spaces, underscores, plurals, common abbreviations ---- */
const REPL = [['identifier','id'],['number','no'],['numb','no'],['num','no'],['nbr','no'],['telephone','phone'],['phoneno','phone'],
  ['dateofbirth','dob'],['birthdate','dob'],['birthday','dob'],['zipcode','zip'],['postalcode','zip'],['postcode','zip'],
  ['department','dept'],['employee','emp'],['firstname','fname'],['givenname','fname'],['lastname','lname'],['surname','lname'],
  ['familyname','lname'],['quantity','qty'],['speciality','specialty'],['licence','license']];
function norm(s){ let x = String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); for(const [a,b] of REPL) x = x.split(a).join(b); return x; }
function normT(s){ const x = norm(s); return (x.length > 3 && x.endsWith('s') && !x.endsWith('ss')) ? x.slice(0, -1) : x; }
function stripPre(x, prefixes){ for(const p of prefixes){ if(p && x.startsWith(p) && x.length > p.length) return x.slice(p.length); } return x; }
function nameEq(cands, user, prefixes=[]){
  const u = normT(user); if(!u) return false;
  const cs = cands.filter(Boolean).map(normT);
  if(cs.includes(u)) return true;
  if(!prefixes.length) return false;
  const us = stripPre(u, prefixes);
  return cs.some(c => stripPre(c, prefixes) === us);
}
function cardKind(c){ const [x,y] = c.split(':'); const m = v => v !== '1'; if(m(x)&&m(y)) return 'M:N'; if(!m(x)&&!m(y)) return '1:1'; return '1:N'; }
function flipCard(c){ const [x,y] = c.split(':'); return y + ':' + x; }
function canonCard(c){ return String(c).replace(/M/g,'N'); }

/* ---- prepare scenario objects (string shorthand -> objects, computed tags) ---- */
function prep(sc){
  if(sc._prep) return sc;
  const A = a => typeof a === 'string' ? {name:a} : a;
  sc.entities.forEach(e => { e.attrs = (e.attrs||[]).map(A); e.aka = e.aka||[]; e.attrs.forEach(a=>a.aka=a.aka||[]); });
  sc.rels.forEach(r => { r.attrs = (r.attrs||[]).map(A); r.aka = r.aka||[]; r.flex = r.flex||[]; r.attrs.forEach(a=>a.aka=a.aka||[]); });
  sc.assumptions = sc.assumptions || [];
  const t = new Set(['keys','attrs','missing_entity','cardinality','participation','missing_rel','fk_missing','fk_in_erd']);
  sc.entities.forEach(e => { if(e.weak) t.add('weak_key'); e.attrs.forEach(a => { if(a.parts) t.add('composite'); if(a.multi) t.add('multivalued'); if(a.derived) t.add('derived'); }); });
  sc.rels.forEach(r => { const k = cardKind(r.card); if(r.identifying) return; if(k==='1:1') t.add('fk_1to1'); if(k==='1:N') t.add('fk_1n'); if(k==='M:N') t.add('mn_table'); if(r.attrs.length) t.add('relattr'); });
  sc.tags = [...t];
  sc._prep = true; return sc;
}
SCENARIOS.forEach(prep);
const SC = id => SCENARIOS.find(s => s.id === id);

/* =====================================================================
   MISTAKE CATEGORIES (weak-point tracker)
   ===================================================================== */
const CATS = {
  missing_entity:{label:'Missed an entity', rule:'Every noun with its own identifying data is an entity (rectangle) and becomes a table.'},
  keys:{label:'Wrong or missing key / PK', rule:'The key attribute (underlined) uniquely identifies the entity and becomes the PK.'},
  attrs:{label:'Missing or misplaced attribute / column', rule:'Read the story sentence by sentence and attach each property to the entity it describes.'},
  composite:{label:'Composite attribute not split / not marked', rule:'Composite -> mark it with its parts in the ERD; in the schema store ONLY the simple parts.'},
  multivalued:{label:'Multivalued attribute not split / not marked', rule:'Multivalued (double oval) -> new table (OwnerKey, Value), PK = both columns.'},
  derived:{label:'Derived attribute stored / not marked', rule:'Derived (dashed oval) is computed from other data and is NOT stored.'},
  weak_key:{label:'Weak entity: owner key / partial key / identifying rel.', rule:'Weak entity -> table with owner PK as FK + partial key; PK = both; ON DELETE CASCADE. ERD: double rectangle, double diamond, dashed underline.'},
  fk_1to1:{label:'Wrong FK side in 1:1', rule:'1:1 -> FK on the side with TOTAL participation, marked UNIQUE.'},
  fk_1n:{label:'Wrong FK side in 1:N', rule:'1:N -> PK of the 1 side goes as FK into the N side table.'},
  fk_missing:{label:'FK not marked / wrong FK target', rule:'Every column that points to another table must be marked FK->TABLE.'},
  mn_table:{label:'Missing M:N table or wrong M:N key', rule:'M:N -> new table with both PKs as FKs; PK = both (+ date if the pair can repeat).'},
  cardinality:{label:'Wrong cardinality ratio', rule:'Ask both directions: one A -> how many B? one B -> how many A?'},
  participation:{label:'Wrong participation (total / partial)', rule:'"every / must / exactly one / at least one" = total (double line); "may / can / some / at most" = partial.'},
  relattr:{label:'Relationship attribute misplaced', rule:'A value that describes one specific pair (date, grade, hours) belongs to the relationship, and in the schema goes with the FK / M:N table.'},
  missing_rel:{label:'Missed a relationship', rule:'Every verb that connects two entities is a relationship (diamond).'},
  fk_in_erd:{label:'Foreign key written in the ERD', rule:'ERDs have no foreign keys - the relationship diamond already connects the entities. FKs appear only in the schema.'}
};
const T1CATS = ['missing_entity','keys','attrs','composite','multivalued','derived','weak_key','cardinality','participation','relattr','missing_rel','fk_in_erd','mn_table'];
const T2CATS = ['missing_entity','keys','attrs','composite','multivalued','derived','weak_key','fk_1to1','fk_1n','fk_missing','mn_table','relattr'];

function recordResult(sc, res, type){
  const errCats = new Set();
  res.items.filter(i => i.status==='err').forEach(i => (i.cat||[]).forEach(c => errCats.add(c)));
  const relevant = type==='t1' ? T1CATS : T2CATS;
  errCats.forEach(c => { const w = S.weak[c] ||= {miss:0, ok:0}; w.miss++; w.last = Date.now(); });
  sc.tags.filter(t => relevant.includes(t) && !errCats.has(t)).forEach(c => { const w = S.weak[c] ||= {miss:0, ok:0}; w.ok++; });
  res.items.filter(i => i.status==='err').slice(0,8).forEach(i => S.log.unshift({t:Date.now(), sc:sc.id, type, cat:(i.cat||[])[0], text:i.text}));
  S.log = S.log.slice(0, 40);
  save();
}
function setBest(id, type, pct){
  const p = S.progress[id] ||= {};
  const cur = p[type] || {best:0, tries:0};
  cur.tries++; cur.best = Math.max(cur.best, pct); p[type] = cur; save();
}

/* =====================================================================
   ERD -> RELATIONAL MAPPING (generates the Type 2 model answer)
   ===================================================================== */
function mapERD(sc, choice={}){
  const E = n => sc.entities.find(e => e.name === n);
  const tables = [], byEnt = {};
  const expl = {entity:[], composite:[], derived:[], multivalued:[], weak:[], '1:1':[], '1:N':[], 'M:N':[]};
  const flat = a => a.parts ? a.parts.slice() : [a.name];
  const pkMemo = {};
  const pk = n => {
    if(pkMemo[n]) return pkMemo[n];
    const e = E(n); if(!e) return [];
    let c = [];
    if(e.weak && E(e.owner)) c = pk(e.owner).slice();
    e.attrs.filter(a => a.key || (e.weak && a.partial)).forEach(a => c.push(...flat(a)));
    return pkMemo[n] = c;
  };
  const akaOf = (entName, col) => {
    const e = E(entName); if(!e) return [];
    const a = e.attrs.find(a => a.name === col); return a ? a.aka : [];
  };
  const order = [], seen = new Set();
  const visit = e => { if(seen.has(e.name)) return; seen.add(e.name); if(e.weak && E(e.owner)) visit(E(e.owner)); order.push(e); };
  sc.entities.forEach(visit);
  const has = (t, n) => t.cols.some(c => norm(c.name) === norm(n));

  for(const e of order){
    const t = {name:e.name, kind:e.weak ? 'weak' : 'entity', ent:e.name, cols:[], cascade:false, aka:e.aka.slice()};
    if(e.weak){
      const o = e.owner;
      pk(o).forEach(c => t.cols.push({name:c, pk:true, fk:o, origin:'ownerkey', aka:akaOf(o,c)}));
      t.cascade = true;
      const pks = e.attrs.filter(a => a.partial).map(a => a.name).join(', ');
      expl.weak.push(`${e.name} is a weak entity owned by ${o}: its table gets the owner's key (${pk(o).join(', ')}) as FK plus its partial key ${pks}; PK = (${pk(e.name).join(', ')}); ON DELETE CASCADE so its rows are removed with the owner.`);
    } else {
      expl.entity.push(`${e.name} (strong entity) -> table ${e.name}, PK = ${pk(e.name).join(', ')}.`);
    }
    for(const a of e.attrs){
      if(a.derived){ expl.derived.push(`${e.name}.${a.name} is derived -> not stored (it is computed when needed).`); continue; }
      if(a.multi) continue;
      if(a.parts) expl.composite.push(`${e.name}.${a.name} is composite -> stored as its simple parts ${a.parts.join(', ')} (no ${a.name} column).`);
      flat(a).forEach(n => t.cols.push({name:n, pk:!!(a.key || (e.weak && a.partial)), origin:a.parts ? 'composite' : (a.partial ? 'partial' : (a.key ? 'key' : 'attr')), comp:a.parts ? a.name : null, aka:a.parts ? [] : a.aka}));
    }
    tables.push(t); byEnt[e.name] = t;
  }
  for(const e of order) for(const a of e.attrs) if(a.multi && !a.derived){
    const name = e.name + '_' + a.name.toUpperCase();
    const t = {name, kind:'multi', ent:e.name, attr:a.name, cols:[], cascade:true,
      aka:[a.name, e.name + a.name, ...e.aka.map(x => x + '_' + a.name), ...a.aka, ...a.aka.map(x => e.name + '_' + x)]};
    pk(e.name).forEach(c => t.cols.push({name:c, pk:true, fk:e.name, origin:'ownerkey', aka:akaOf(e.name,c)}));
    flat(a).forEach(n => t.cols.push({name:n, pk:true, origin:'multi', aka:a.aka}));
    tables.push(t);
    expl.multivalued.push(`${e.name}.${a.name} is multivalued -> new table ${name}(${t.cols.map(c => c.name).join(', ')}); PK = both columns; ${pk(e.name).join(', ')} is a FK to ${e.name}.`);
  }
  for(const r of sc.rels){
    const kind = cardKind(r.card);
    if(r.identifying){
      const weakName = (E(r.b) && E(r.b).weak) ? r.b : r.a;
      const t = byEnt[weakName];
      r.attrs.forEach(a => t && t.cols.push({name:a.name, origin:'relattr', rel:r.name, aka:a.aka}));
      expl.weak.push(`${r.name} is the identifying relationship of ${weakName}: no extra table or FK - it is already represented by the owner key inside ${weakName}.`);
      continue;
    }
    if(kind === 'M:N'){
      const t = {name:r.name, kind:'mn', rel:r.name, cols:[], cascade:false, aka:[...r.aka, r.a + '_' + r.b, r.b + '_' + r.a]};
      const add = ent => pk(ent).forEach(c => { const n = has(t, c) ? ent + '_' + c : c; t.cols.push({name:n, pk:true, fk:ent, origin:'mnkey', rel:r.name, aka:[c, ...akaOf(ent,c)]}); });
      add(r.a); add(r.b);
      r.attrs.forEach(a => flat(a).forEach(n => {
        const isKey = !!r.keyAttr && norm(r.keyAttr) === norm(a.name);
        t.cols.push({name:n, pk:isKey, keyOpt:isKey && !r.keyAttrRequired, origin:'relattr', rel:r.name, aka:a.aka});
      }));
      tables.push(t);
      const keyCols = t.cols.filter(c => c.pk).map(c => c.name);
      expl['M:N'].push(`${r.name} (${r.a} M:N ${r.b}) -> new table ${r.name} holding both keys as FKs${r.attrs.length ? '; its attributes ' + r.attrs.map(a => a.name).join(', ') + ' are stored here' : ''}; PK = (${keyCols.join(', ')})${r.keyAttr ? ` - ${r.keyAttr} is in the key because the same pair can occur more than once` : ''}.`);
      continue;
    }
    let host, target, side;
    if(kind === '1:1'){
      side = choice[r.name];
      if(!side){
        if(r.partA === 'total' && r.partB !== 'total') side = 'a';
        else if(r.partB === 'total' && r.partA !== 'total') side = 'b';
        else side = r.fkIn || 'b';
      }
      host = side === 'a' ? r.a : r.b; target = side === 'a' ? r.b : r.a;
    } else {
      const aMany = r.card.split(':')[0] !== '1';
      host = aMany ? r.a : r.b; target = aMany ? r.b : r.a;
    }
    const t = byEnt[host]; if(!t) continue;
    const tk = pk(target);
    const fkCols = [];
    tk.forEach(c => {
      let n = (r.fkName && tk.length === 1) ? r.fkName : c;
      if(has(t, n)) n = r.name.charAt(0) + r.name.slice(1).toLowerCase().replace(/_./g, m => m[1].toUpperCase()) + c;
      fkCols.push(n);
      t.cols.push({name:n, fk:target, unique:kind === '1:1', origin:'relfk', rel:r.name, relKind:kind, aka:[c, ...akaOf(target,c)]});
    });
    r.attrs.forEach(a => flat(a).forEach(n => t.cols.push({name:has(t,n) ? r.name + '_' + n : n, origin:'relattr', rel:r.name, aka:a.aka})));
    const ra = r.attrs.length ? ` Its attribute(s) ${r.attrs.map(a => a.name).join(', ')} go into ${host} too.` : '';
    if(kind === '1:1'){
      const both = r.partA === r.partB;
      expl['1:1'].push(`${r.name} (${r.a} 1:1 ${r.b}) -> FK ${fkCols.join(', ')} -> ${target} placed in ${host} and marked UNIQUE` +
        (both ? ` (both sides have ${r.partA} participation, so either side is acceptable - this is an assumption).` : ` because ${host} has total participation (every ${host} row has a value, no NULLs).`) + ra);
    } else {
      expl['1:N'].push(`${r.name} (${r.a} ${r.card} ${r.b}) -> the PK of the 1 side (${target}) goes as FK ${fkCols.join(', ')} into the N side table ${host}.` + ra);
    }
  }
  return {tables, expl, choice};
}
function schemaVariants(sc){
  const amb = sc.rels.filter(r => !r.identifying && cardKind(r.card) === '1:1' && r.partA === r.partB);
  const out = [mapERD(sc)];
  for(let m = 0; m < (1 << amb.length); m++){
    const ch = {}; amb.forEach((r,i) => ch[r.name] = ((m >> i) & 1) ? 'a' : 'b');
    out.push(mapERD(sc, ch));
  }
  return out;
}
function fmtTable(t){
  return `${t.name}(${t.cols.map(c => c.name + (c.pk ? ' PK' : '') + (c.fk ? ' FK->' + c.fk : '') + (c.unique ? ' UNIQUE' : '')).join(', ')})${t.kind === 'weak' ? '  ON DELETE CASCADE' : ''}`;
}
function fmtSchema(model){ return model.tables.map(fmtTable).join('\n'); }

/* =====================================================================
   PLAIN-TEXT SCHEMA PARSER
   Accepts: DOCTOR(DoctorID PK, FirstName, DeptID FK->DEPARTMENT)
   also FK -> X, FK X, FK(X), FK references X, REFERENCES X, PK FK->X,
   PK(a, b) / FOREIGN KEY(a) REFERENCES X inside the brackets, UNIQUE, ON DELETE CASCADE
   ===================================================================== */
const NOT_TABLES = /^(pk|fk|primary|foreign|key|references|ref|unique|cascade)$/i;
function splitTop(body){ const out = []; let d = 0, cur = ''; for(const ch of body){ if(ch === '(') d++; if(ch === ')') d--; if(ch === ',' && d === 0){ out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function parseSchema(text){
  const s = String(text||''); const tables = []; let i = 0;
  const re = /([A-Za-z_][A-Za-z0-9_]*)\s*\(/g;
  while(i < s.length){
    re.lastIndex = i; const m = re.exec(s); if(!m) break;
    let j = m.index + m[0].length, depth = 1; const start = j;
    while(j < s.length && depth > 0){ if(s[j] === '(') depth++; else if(s[j] === ')') depth--; j++; }
    if(NOT_TABLES.test(m[1])){ i = j; continue; }
    const body = s.slice(start, depth === 0 ? j - 1 : j);
    const eol = s.indexOf('\n', j); const tail = s.slice(j, eol < 0 ? s.length : eol);
    tables.push(parseTable(m[1], body, tail));
    i = j;
  }
  return tables;
}
function fkTarget(str){
  let m = str.match(/\b(?:fk|foreign\s*key)\b\s*(?:-+>|=+>|>|:|→)?\s*(?:references\s+|ref\s+|to\s+)?\(?\s*([A-Za-z_]\w*)/i);
  if(m && !/^(references|ref|to)$/i.test(m[1])) return m[1];
  m = str.match(/\breferences\s+([A-Za-z_]\w*)/i); if(m) return m[1];
  if(/\b(fk|foreign\s*key)\b/i.test(str)) return '?';
  return null;
}
function parseTable(name, body, tail){
  const t = {name, cols:[], cascade:/cascade/i.test(body + ' ' + tail)};
  const pkList = [], fkList = [];
  let prev = null;
  for(let raw of splitTop(body)){
    raw = raw.trim(); if(!raw) continue;
    let m;
    if((m = raw.match(/^(?:primary\s*key|pk)\s*\((.*)\)\s*$/i))){ pkList.push(...splitList(m[1])); continue; }
    if((m = raw.match(/^(?:foreign\s*key|fk)\s*\(([^)]*)\)\s*(.*)$/i))){ const tg = fkTarget('fk ' + m[2].replace(/^\s*(-+>|=>|>)/,'->')) || (m[2].match(/([A-Za-z_]\w*)/)||[])[1]; splitList(m[1]).forEach(c => fkList.push([c, tg])); continue; }
    if(/^(on\s+delete|cascade)/i.test(raw)) continue;
    const tok = raw.match(/^[*#_\s]*([A-Za-z_][A-Za-z0-9_]*)/); if(!tok) continue;
    const marker = /^(pk|fk|unique|references|primary|foreign|not)$/i.test(tok[1]);
    const target = marker && prev ? prev : {name:tok[1], pk:false, fk:null, unique:false};
    const rest = marker ? raw : raw.slice(tok[0].length);
    if(/^\s*[*#]/.test(raw) && !marker) target.pk = true;
    if(/\b(pk|primary\s*key)\b/i.test(rest)) target.pk = true;
    const fk = fkTarget(rest); if(fk) target.fk = fk;
    if(/\bunique\b/i.test(rest)) target.unique = true;
    if(!marker){ t.cols.push(target); prev = target; }
  }
  pkList.forEach(n => { const c = t.cols.find(c => normT(c.name) === normT(n)); if(c) c.pk = true; });
  fkList.forEach(([n, tg]) => { const c = t.cols.find(c => normT(c.name) === normT(n)); if(c) c.fk = tg || '?'; });
  return t;
}

/* =====================================================================
   TYPE 2 CHECKER (schema vs model)
   ===================================================================== */
function checkSchema(sc, text){

    if(!userTarget || userTarget === '?') return false;
    const e = E(modelTarget);
    if(nameEq([modelTarget, ...(e ? e.aka : [])], userTarget)) return true;
    if(e && e.weak){ const o = E(e.owner); if(o && nameEq([o.name, ...o.aka], userTarget)) return true; }
    return false;
  };

    const e = E(mt.ent || ''); const p = [normT(mt.name), ...(mt.aka||[]).map(normT)];

    tryPass((mc,c) => nameEq([mc.name, ...(mc.aka||[])], c.name, prefixes));

        else if(mc.origin === 'multi'){ t = `${mt.name}: the value column is missing`; h = 'A multivalued table = (OwnerKey, Value).'; cat = 'multivalued'; }
        else if(mc.origin === 'partial'){ t = `${mt.name}: the partial key is missing`; h = 'The partial key (dashed underline) is part of the weak table and of its PK.'; cat = 'weak_key'; }
        else if(mc.origin === 'key'){ t = `${mt.name}: the key column is missing`; h = 'The underlined key attribute becomes the PK.'; cat = 'keys'; }
        else if(mc.origin === 'relfk' && mc.relKind === '1:1'){ t = `${mt.name}: missing the foreign key for the 1:1 relationship ${mc.rel}`; h = 'In 1:1, put the FK in the table of the entity with TOTAL participation, and mark it UNIQUE.'; cat = 'fk_1to1'; missingFK.push({mt, mc}); }

        else if(!tableRefEq(mc.fk, uc.fk)) R('err', `${mt.name}.${uc.name} references the wrong table (${uc.fk})`, 'Which entity does this key really come from?', `${uc.name} FK->${mc.fk}`, 'fk_missing');
        else R('ok', `${mt.name}.${uc.name} FK->${uc.fk}`, '', '', null);
        if(mc.unique && !uc.unique) R('warn', `${mt.name}.${uc.name}: mark it UNIQUE`, 'Without UNIQUE the FK would allow 1:N. UNIQUE is what makes it 1:1.', `${uc.name} FK->${mc.fk} UNIQUE`, 'fk_1to1');

    const extraPKcols = ut.cols.filter(c => c.pk && ![...pairs.entries()].some(([m,u]) => u === c && m.pk));

}

/* =====================================================================
   TYPE 1 CHECKER (structured ERD answer vs model)
   ===================================================================== */
function newAns(){ return {entities:[], rels:[]}; }
function newEnt(){ return {id:nid(), name:'', weak:false, owner:'', attrs:[newAttr()]}; }
function newAttr(){ return {id:nid(), name:'', key:false, partial:false, multi:false, derived:false, composite:false, parts:''}; }
function newRel(){ return {id:nid(), name:'', a:'', b:'', card:'1:N', partA:'partial', partB:'partial', identifying:false, attrs:''}; }

function describeAttr(a){
  const f = [];
  if(a.key) f.push('key'); if(a.partial) f.push('partial key'); if(a.multi) f.push('multivalued'); if(a.derived) f.push('derived');
  if(a.parts) f.push('composite: ' + a.parts.join(', '));
  return a.name + (f.length ? ' (' + f.join('; ') + ')' : '');
}
function describeRel(r){
  return `${r.name}${r.identifying ? ' [identifying]' : ''}: ${r.a} ${r.card} ${r.b}; ${r.a} ${r.partA}, ${r.b} ${r.partB}${r.flex.length ? ' (participation of ' + r.flex.map(s => s === 'a' ? r.a : r.b).join(', ') + ' is debatable - not graded)' : ''}${r.attrs.length ? '; attributes: ' + r.attrs.map(a => a.name).join(', ') : ''}`;
}
function checkERD(sc, ans){
  const items = []; const tally = {a:{ok:0,total:0}, b:{ok:0,total:0}};
  const R = (status, part, text, hint, reveal, cat, target, scored=true) => {
    items.push({status, part, text, hint, reveal, cat:cat ? [].concat(cat) : [], target});
    if(scored && status !== 'warn'){ tally[part].total++; if(status === 'ok') tally[part].ok++; }
  };
  const E = n => sc.entities.find(e => e.name === n);
  const ue = ans.entities.filter(e => e.name.trim());
  const emap = new Map(), rev = new Map();
  const ua = e => e.attrs.filter(a => a.name.trim());

    if(emap.has(me)) continue;

      if(rev.has(u)) continue;

      const hit = ua(u).filter(a => nameEq(names, a.name)).length;

    const u = emap.get(me);

      const clues = me.attrs.filter(a => !a.key && !a.partial).slice(0,3).map(a => words(a.name)).join(', ');
      R('err', 'a', me.weak ? 'A weak entity is missing' : 'An entity is missing', `Look for a thing in the story that has: ${clues || words(me.attrs[0].name)}.`, `${me.name}${me.weak ? ' (WEAK, owner ' + me.owner + ')' : ''}: ${me.attrs.map(describeAttr).join(', ')}`, me.weak ? 'weak_key' : 'missing_entity', null);
      me.attrs.forEach(() => { tally.a.total++; });
      continue;
    }
    const renamed = normT(u.name) !== normT(me.name) ? ` (model name: ${me.name})` : '';
    // weak / strong
    if(me.weak && !u.weak) R('err', 'a', `${u.name}: entity type is not right`, `Can a ${words(me.name)} be identified by its own attributes alone, or only together with another entity?`, `${me.name} is a WEAK entity (double rectangle), owner ${me.owner}.`, 'weak_key', u.id);
    else if(!me.weak && u.weak) R('err', 'a', `${u.name} is marked weak, but it is not`, 'A weak entity has no key of its own. This one does.', `${me.name} is a strong entity with key ${me.attrs.filter(a => a.key).map(a => a.name).join(', ')}.`, 'weak_key', u.id);
    else if(me.weak){
      const ownU = emap.get(E(me.owner));
      if(!ownU || u.owner !== ownU.id) R('err', 'a', `${u.name}: wrong or missing owner`, 'Which entity is needed to identify it?', `Owner of ${me.name} is ${me.owner}.`, 'weak_key', u.id);

    } else R('ok', 'a', `Entity ${u.name}${renamed}`, '', '', null, u.id);

          continue;
        }

        if(nameLike) a = nameLike;
      }

          const h = ma.key ? `How is each ${words(me.name)} uniquely identified?` : ma.partial ? 'The weak entity needs its partial key (the number/name used inside its owner).' : `Reread what the story says about each ${words(me.name)} - one property is not listed yet.`;

      used.add(a);

  const score = total ? ok / total : 0;

}

/* convert the model ERD to an answer object (used by "load model into form" and tests) */
function modelToAns(sc){
  const ids = {};

/* convert a student answer to ERD data for drawing */
function ansToERD(ans){
  const seen = {};

  const entities = ans.entities.filter(e => e.name.trim()).map(e => {

  });
  const rels = ans.rels.filter(r => nm(r.a) && nm(r.b)).map(r => ({name:r.name.trim() || '?', a:nm(r.a), b:nm(r.b), card:r.card, partA:r.partA, partB:r.partB, identifying:r.identifying, attrs:splitList(r.attrs).map(n => ({name:n}))}));

/* =====================================================================
   CHEN ERD RENDERER (SVG, automatic layout, draggable)

const mctx = document.createElement('canvas').getContext('2d');

    const [ca, cb] = String(r.card || '1:1').split(':');

    edges.push({s:id, t:'E:' + r.b, kind:'rel', card:cb, total:r.partB === 'total'});
    rels.push({id, ea:'E:' + r.a, eb:'E:' + r.b});

}
function layout(g){

    if(e.total) s += `<line class="ln2" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><line class="gap" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;

  }
  for(const e of g.edges){
    if(e.kind !== 'rel' || !e.card) continue;
    const a = byId[e.s], b = byId[e.t]; if(!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const t = Math.min(0.45, (a.w / 2 + 14) / d);
    const px = -dy / d * 11, py = dx / d * 11;

const DIAG = {};
function mountDiagram(root, key, getERD){
  root.innerHTML = `<div class="dtools noprint"><button class="btn sm" data-z="out" title="Zoom out">−</button><button class="btn sm" data-z="fit">Fit</button><button class="btn sm" data-z="in" title="Zoom in">+</button><button class="btn sm" data-z="re">Re-layout</button><span class="small muted">Drag shapes to rearrange.</span></div><div class="dwrap"><svg class="erd" xmlns="http://www.w3.org/2000/svg"></svg></div>`;
  const svg = root.querySelector('svg');
  const st = DIAG[key] ||= {pos:{}, zoom:0};
  let g = null, byId = {}, vb = null;
  function computeVB(){
    if(!g.nodes.length){ vb = {x:0, y:0, w:400, h:120}; return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    g.nodes.forEach(n => { x0 = Math.min(x0, n.x - n.w/2); y0 = Math.min(y0, n.y - n.h/2); x1 = Math.max(x1, n.x + n.w/2); y1 = Math.max(y1, n.y + n.h/2); });
    vb = {x:x0 - 24, y:y0 - 24, w:x1 - x0 + 48, h:y1 - y0 + 48};
  }
  function applyZoom(){
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if(!st.zoom){ svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.minWidth = Math.min(vb.w, 560) + 'px'; }
    else { svg.style.width = (vb.w * st.zoom) + 'px'; svg.style.height = (vb.h * st.zoom) + 'px'; svg.style.minWidth = ''; }
  }
  function paint(){
    if(!g.nodes.length){ svg.innerHTML = `<text class="empty" x="200" y="60">Nothing to draw yet - add entities first.</text>`; return; }
    svg.innerHTML = `<g>${drawEdges(g, byId)}</g><g>${g.nodes.map(drawNode).join('')}</g>`;
  }
  function draw(relayout){
    if(relayout) st.pos = {};
    g = buildGraph(getERD());
    layout(g);
    byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
    g.nodes.forEach(n => { const p = st.pos[n.id]; if(p){ n.x = p.x; n.y = p.y; } });
    computeVB(); applyZoom(); paint();
  }
  // dragging
  let drag = null, raf = 0;
  const toSvg = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const descendants = id => g.nodes.filter(n => { let o = n.owner; while(o){ if(o === id) return true; o = (byId[o] || {}).owner; } return false; });
  svg.addEventListener('pointerdown', ev => {
    const el = ev.target.closest('[data-id]'); if(!el || !g) return;
    const n = byId[el.getAttribute('data-id')]; if(!n) return;
    ev.preventDefault();
    const p = toSvg(ev);
    drag = {n, dx:p.x - n.x, dy:p.y - n.y, group:[n, ...descendants(n.id)].map(m => ({m, ox:m.x - n.x, oy:m.y - n.y}))};
    svg.style.cursor = 'grabbing';
  });
  const move = ev => {
    if(!drag) return;
    const p = toSvg(ev);
    const nx = p.x - drag.dx, ny = p.y - drag.dy;
    drag.group.forEach(({m, ox, oy}) => { m.x = nx + ox; m.y = ny + oy; st.pos[m.id] = {x:m.x, y:m.y}; });
    if(!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); });
  };
  const up = () => { if(!drag) return; drag = null; svg.style.cursor = ''; computeVB(); applyZoom(); paint(); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  root.querySelector('.dtools').addEventListener('click', ev => {
    const z = ev.target.getAttribute('data-z'); if(!z) return;
    if(z === 're'){ draw(true); return; }
    const fitZ = () => { const cw = root.querySelector('.dwrap').clientWidth || vb.w; return Math.min(vb.w, Math.max(cw, Math.min(vb.w, 560))) / vb.w; };
    if(z === 'fit') st.zoom = 0;
    if(z === 'in') st.zoom = (st.zoom || fitZ()) * 1.25;
    if(z === 'out') st.zoom = Math.max(0.2, (st.zoom || fitZ()) / 1.25);
    applyZoom();
  });
  draw(false);
  return {draw};
}

function neededCover(sc){

  if(t.has('weak_key')) out.push({k:'weak', label:'Weak entity', re:/weak|partial key|owner|cascade/i});
  if(t.has('fk_1to1')) out.push({k:'1:1', label:'1:1 relationships', re:/1\s*:\s*1|one[\s-]to[\s-]one/i});

}

function gradeExam(){
  const ex = S.exam; const s1 = SC(ex.t1), s2 = SC(ex.t2);

  const r2 = checkSchema(s2, ex.ans2.schema);
  const cov = coverResult(s2, ex.ans2.expl, ex.ans2.assume);
  const part = (t) => t.total ? t.ok / t.total : 0;
  const b = {
    t1a:Math.round(part(r1.tally.a) * 25 * 10) / 10,
    t1b:Math.round(part(r1.tally.b) * 25 * 10) / 10,
    t2a:Math.round(r2.score * 35 * 10) / 10,
    t2b:Math.round(cov.explScore * 10 * 10) / 10,
    t2c:cov.aOk ? 5 : ((ex.ans2.assume || '').trim() ? 2 : 0)
  };
  const total = Math.round((b.t1a + b.t1b + b.t2a + b.t2b + b.t2c) * 10) / 10;
  recordResult(s1, r1, 't1'); recordResult(s2, r2, 't2');
  ex.result = {b, total, at:Date.now(), used:Math.min(EXAM_MS, Date.now() - ex.start)};

function pickFor(cat, type){
  const pool = SCENARIOS.filter(s => s.role !== 'worked' && s.tags.includes(cat));
  if(!pool.length) return null;
  const best = s => ((S.progress[s.id] || {})[type] || {best:-1}).best;
  return pool.map(s => ({s, k:best(s) + Math.random() * 30})).sort((a,b) => a.k - b.k)[0].s;
}
function viewWeak(){
  const rows = Object.entries(S.weak).filter(([c,w]) => CATS[c] && w.miss > 0).sort((a,b) => (b[1].miss - b[1].ok * 0.5) - (a[1].miss - a[1].ok * 0.5));
  const max = Math.max(1, ...rows.map(([,w]) => w.miss));

/* ---------------- Review sheet ---------------- */
function symbolSVG(nodes, edges=[]){
  const g = {nodes:nodes.map(n => ({...n, tw:tw(n.label, n.type === 'entity' || n.type === 'weak')})), edges};
  g.nodes.forEach(n => { if(!n.w) n.w = n.type === 'attr' ? Math.max(n.tw + 30, 62) : n.type === 'rel' || n.type === 'idrel' ? Math.max(n.tw * 1.45 + 26, 96) : n.tw + 34; if(!n.h) n.h = n.type === 'attr' ? 30 : n.type === 'rel' || n.type === 'idrel' ? 56 : 42; });
  const byId = Object.fromEntries(g.nodes.map(n => [n.id, n]));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  g.nodes.forEach(n => { x0 = Math.min(x0, n.x - n.w/2); y0 = Math.min(y0, n.y - n.h/2); x1 = Math.max(x1, n.x + n.w/2); y1 = Math.max(y1, n.y + n.h/2); });
  return `<svg class="erd" viewBox="${x0 - 8} ${y0 - 8} ${x1 - x0 + 16} ${y1 - y0 + 16}">${drawEdges(g, byId)}${g.nodes.map(drawNode).join('')}</svg>`;
}

   ${sym('Relationship', 'Diamond. A verb connecting entities.', symbolSVG([{id:'a', type:'rel', label:'BORROWS', x:0, y:0}]))}
   ${sym('Identifying relationship', 'Double diamond. Links a weak entity to its owner.', symbolSVG([{id:'a', type:'idrel', label:'HAS_COPY', x:0, y:0}]))}
   ${sym('Attribute', 'Oval.', symbolSVG([{id:'a', type:'attr', label:'Title', x:0, y:0}]))}
   ${sym('Key attribute', 'Underlined name.', symbolSVG([{id:'a', type:'attr', label:'ISBN', key:true, x:0, y:0}]))}
   ${sym('Partial key', 'Dashed underline (weak entity only).', symbolSVG([{id:'a', type:'attr', label:'CopyNo', partial:true, x:0, y:0}]))}
   ${sym('Multivalued attribute', 'Double oval. Several values.', symbolSVG([{id:'a', type:'attr', label:'Phone', multi:true, x:0, y:0}]))}
   ${sym('Derived attribute', 'Dashed oval. Computed, not stored.', symbolSVG([{id:'a', type:'attr', label:'Age', derived:true, x:0, y:0}]))}
   ${sym('Composite attribute', 'Oval with its parts as ovals.', symbolSVG([{id:'n', type:'attr', label:'Name', x:0, y:0},{id:'f', type:'attr', label:'FirstName', x:-62, y:48},{id:'l', type:'attr', label:'LastName', x:62, y:48}], [{s:'n', t:'f'},{s:'n', t:'l'}]))}
   ${sym('Total participation', 'Double line: EVERY entity takes part.', symbolSVG([{id:'e', type:'entity', label:'BOOK', x:-80, y:0},{id:'r', type:'rel', label:'PUBLISHES', x:80, y:0}], [{s:'r', t:'e', kind:'rel', card:'N', total:true}]))}

  </div>
  <p class="small muted">Cardinality labels (1, N, M) are written on the line next to each entity: PUBLISHER 1 - PUBLISHES - N BOOK means one publisher, many books.</p>
  <h2>Mapping rules (ERD -> relational schema)</h2>
  <table class="t">
   <tr><th>ERD element</th><th>Becomes</th><th>Key</th></tr>
   <tr><td>Strong entity</td><td>Table with all simple attributes</td><td>PK = key attribute</td></tr>
   <tr><td>Composite attribute</td><td>Only its simple parts as columns (no "Name" column)</td><td>-</td></tr>
   <tr><td>Derived attribute</td><td>Not stored</td><td>-</td></tr>
   <tr><td>Multivalued attribute</td><td>New table <code>OWNER_ATTR(OwnerKey FK, Value)</code></td><td>PK = both columns</td></tr>
   <tr><td>Weak entity</td><td>Table with owner PK as FK + partial key + other attributes; <b>ON DELETE CASCADE</b></td><td>PK = owner key + partial key</td></tr>
   <tr><td>Identifying relationship</td><td>Nothing extra (already covered by the weak table)</td><td>-</td></tr>
   <tr><td>1:N relationship</td><td>FK = PK of the <b>1 side</b>, placed in the <b>N side</b> table; relationship attributes go there too</td><td>-</td></tr>
   <tr><td>1:1 relationship</td><td>FK on the side with <b>total participation</b>, marked <b>UNIQUE</b>; relationship attributes go with it</td><td>-</td></tr>
   <tr><td>M:N relationship</td><td>New table with both PKs as FKs + relationship attributes</td><td>PK = both keys (+ date if the same pair can repeat)</td></tr>
  </table>
  <h2>Type 1 checklist (story -> ERD)</h2>
  <ol class="steps"><li>Nouns with own data -> entities. "Identified by X together with Y" / "numbered within" -> weak entity (owner + partial key).</li>
   <li>Attributes: key (ID), composite ("name (first, last)"), multivalued ("several", "set of", "one or more"), derived ("calculated", age).</li>
   <li>Verbs -> relationships. Cardinality: ask both directions. Participation: "every / exactly one / at least one" = total.</li>
   <li>Dates, grades, hours of one specific pair -> relationship attributes.</li>
   <li>No foreign keys in the ERD.</li></ol>
  <h2>Type 2 checklist (ERD -> schema)</h2>
  <ol class="steps"><li>One table per strong entity; split composites; drop derived.</li><li>One table per multivalued attribute.</li>
   <li>Weak entity table: owner key + partial key = PK, ON DELETE CASCADE.</li><li>1:1 -> FK UNIQUE on the total side. 1:N -> FK on the N side. M:N -> new table.</li>
   <li>Mark every PK and every FK (FK->TABLE). Write (b) explanation per concept and (c) assumptions (M:N keys, 1:1 side, NULLs).</li></ol>
  <h2>Common traps</h2>
  <ol class="steps">
   <li>Storing a derived attribute (Age, YearsOfService, TotalAmount) as a column.</li>
   <li>Keeping a composite "Name" or "Address" column instead of its parts.</li>
   <li>Keeping a multivalued Phone inside the entity table (or Phone1, Phone2 columns).</li>
   <li>Multivalued table with PK = only the owner key (allows only one value).</li>
   <li>Weak table PK = only the partial key - forgetting the owner key.</li>
   <li>Forgetting ON DELETE CASCADE for the weak entity.</li>
   <li>1:N with the FK on the 1 side (would need many values in one cell).</li>
   <li>M:N mapped with a FK in one entity table instead of a new table.</li>
   <li>M:N key without the date when the same pair can repeat (borrowing the same copy again, treating the same patient again).</li>
   <li>1:1 FK on the partial side -> mostly NULLs; and forgetting UNIQUE (turns it into 1:N).</li>
   <li>Putting relationship attributes (LoanDate, Grade, HeadSince) on an entity.</li>
   <li>Writing foreign keys as attributes in the ERD.</li>
   <li>Weak entity drawn without the double diamond, or with a single (partial) line.</li>
   <li>Confusing participation (total / partial) with cardinality (1 / N).</li>
  </ol>
  <h2>Schema notation used in this app</h2>
  <pre class="schema">${esc(SCHEMA_HELP)}</pre>`;
