name: urbanflow_ai
description: UrbanFlow AI - smart city management for Skopje, North Macedonia.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  provider: 6.1.5+1
  flutter_map: 8.3.2
  latlong2: 0.10.1
  fl_chart: 1.3.1
  geolocator: 14.1.2
  shared_preferences: 2.5.6
  material_ui: 1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
