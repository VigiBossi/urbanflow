name: urbanflow_ai
description: UrbanFlow AI - Smart City Platform connecting citizens and municipalities.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State Management
  provider: ^6.1.2

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Persistence
  shared_preferences: ^2.3.2

  # Network
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.68.0

  # UI Enhancements
  shimmer: ^3.0.0
  animations: ^2.0.11

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
